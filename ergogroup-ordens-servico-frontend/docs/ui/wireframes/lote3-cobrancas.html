<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wireframe Cobranças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
/* Wireframe do lote 3 (R2): cobranças, registrar lançamento e situação financeira, sobre o protótipo dos lotes 1 e 2.
   Tokens de docs/ui/design-system.md §2; layout: sidebar + área principal, como em navegacao.html. */
:root{
  --canvas:220 20% 96.5%;--background:0 0% 100%;--foreground:222 47% 11%;--card:0 0% 100%;
  --muted:210 40% 96%;--muted-foreground:215 20% 42%;--border:214 32% 91%;--border-strong:214 24% 84%;
  --accent:215 25% 93%;--primary:173 58% 31%;--primary-foreground:0 0% 100%;
  --success:142 71% 40%;--success-subtle:138 76% 96%;--success-strong:142 72% 26%;
  --warning:38 92% 50%;--warning-subtle:48 96% 94%;--warning-strong:26 90% 33%;
  --danger:0 72% 51%;--danger-subtle:0 86% 96%;--danger-strong:0 70% 40%;
  --info:221 83% 53%;--info-subtle:214 95% 96%;--info-strong:224 70% 42%;
  --shadow:0 1px 2px hsl(222 47% 11%/.06),0 1px 1px hsl(222 47% 11%/.04);
  --shadow-lg:0 12px 32px hsl(222 47% 11%/.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:222 47% 4.5%;--background:222 47% 6%;--foreground:210 40% 98%;--card:222 47% 8%;
  --muted:222 30% 15%;--muted-foreground:215 20% 62%;--border:222 30% 16%;--border-strong:222 25% 24%;
  --accent:222 30% 13%;--primary:173 55% 45%;--primary-foreground:222 47% 6%;
  --success:142 60% 45%;--success-subtle:172 50% 11%;--success-strong:142 69% 62%;
  --warning:38 92% 55%;--warning-subtle:35 26% 14%;--warning-strong:43 96% 62%;
  --danger:0 72% 55%;--danger-subtle:329 35% 12%;--danger-strong:0 91% 72%;
  --info:217 91% 60%;--info-subtle:219 55% 16%;--info-strong:213 94% 72%;
  --shadow:0 1px 2px hsl(0 0% 0%/.4);--shadow-lg:0 12px 32px hsl(0 0% 0%/.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:222 47% 4.5%;--background:222 47% 6%;--foreground:210 40% 98%;--card:222 47% 8%;
  --muted:222 30% 15%;--muted-foreground:215 20% 62%;--border:222 30% 16%;--border-strong:222 25% 24%;
  --accent:222 30% 13%;--primary:173 55% 45%;--primary-foreground:222 47% 6%;
  --success:142 60% 45%;--success-subtle:172 50% 11%;--success-strong:142 69% 62%;
  --warning:38 92% 55%;--warning-subtle:35 26% 14%;--warning-strong:43 96% 62%;
  --danger:0 72% 55%;--danger-subtle:329 35% 12%;--danger-strong:0 91% 72%;
  --info:217 91% 60%;--info-subtle:219 55% 16%;--info-strong:213 94% 72%;
  --shadow:0 1px 2px hsl(0 0% 0%/.4);--shadow-lg:0 12px 32px hsl(0 0% 0%/.5);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:hsl(var(--canvas));color:hsl(var(--foreground));font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid hsl(var(--primary));outline-offset:2px}
svg.lucide{width:16px;height:16px;flex-shrink:0;stroke-width:2}
h1,h2,h3,p{margin:0}
h1{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;line-height:22px;font-weight:700}
.muted{color:hsl(var(--muted-foreground))}
.num{font-variant-numeric:tabular-nums}
.sm{font-size:12px;line-height:16px}
a{color:hsl(var(--primary));text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}

/* ── barra do wireframe (fora do produto) ── */
.wf{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 16px;font-size:12px;background:repeating-linear-gradient(45deg,hsl(var(--muted)),hsl(var(--muted)) 6px,hsl(var(--canvas)) 6px,hsl(var(--canvas)) 12px);border-bottom:1px dashed hsl(var(--muted-foreground)/.5)}
.wf b{font-weight:700}
.wf label{display:inline-flex;align-items:center;gap:6px}
.wf select{font-size:12px;padding:3px 6px;border:1px solid hsl(var(--border-strong));border-radius:6px;background:hsl(var(--card))}
.seg{display:inline-flex;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--card));padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))}
.seg button.on{background:hsl(var(--foreground));color:hsl(var(--background))}
.wf .regra{flex-basis:100%;color:hsl(var(--muted-foreground))}
.wf .regra b{color:hsl(var(--foreground))}

/* ── moldura do app ── */
.app{display:flex;height:calc(100% - var(--wf-h,74px));min-height:560px}
.sb{width:240px;flex-shrink:0;display:flex;flex-direction:column;background:hsl(var(--background));border-right:1px solid hsl(var(--border))}
.sb-top{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid hsl(var(--border))}
.mark{width:28px;height:28px;border-radius:8px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;font-weight:700;line-height:16px}
.brand small{display:block;font-size:11px;line-height:14px;color:hsl(var(--muted-foreground))}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.grp-h{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.02em;color:hsl(var(--muted-foreground));padding:14px 8px 4px}
.it{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 10px;border-radius:8px;color:hsl(var(--muted-foreground));font-weight:500;cursor:pointer;white-space:nowrap;user-select:none}
.it:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.it.on{background:hsl(var(--primary)/.09);color:hsl(var(--primary));font-weight:600}
.it .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.it.fora{opacity:.55}
.cnt{font-size:11px;font-weight:600;line-height:18px;min-width:20px;padding:0 6px;border-radius:999px;text-align:center;font-variant-numeric:tabular-nums;background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong))}
.sb-foot{border-top:1px solid hsl(var(--border));padding:10px;position:relative}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.me:hover{background:hsl(var(--accent))}
.av{width:32px;height:32px;border-radius:50%;background:hsl(var(--primary)/.14);color:hsl(var(--primary));display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.av.sm{width:22px;height:22px;font-size:10px}
.who{flex:1;min-width:0;line-height:17px}
.who .n,.who .r{display:block}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .r{font-size:12px;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{position:absolute;left:10px;right:10px;bottom:64px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:5}
.pop .h{font-size:11px;font-weight:600;color:hsl(var(--muted-foreground));padding:6px 8px 4px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left}
.pop button:hover{background:hsl(var(--accent))}
.pop button.on{font-weight:600;color:hsl(var(--primary))}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:hsl(var(--background))}
.hd{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid hsl(var(--border));flex-shrink:0}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden}
.crumbs b{color:hsl(var(--foreground));font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:14px;height:14px}
.search{display:flex;align-items:center;gap:8px;width:260px;height:34px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:8px;color:hsl(var(--muted-foreground));background:hsl(var(--canvas))}
.search span{flex:1}
kbd{font-family:inherit;font-size:11px;line-height:16px;padding:0 5px;border:1px solid hsl(var(--border));border-bottom-width:2px;border-radius:5px;background:hsl(var(--card))}
.menu-btn{display:none}
.page{flex:1;overflow-y:auto;padding:24px 24px 48px}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}

/* ── componentes ── */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid hsl(var(--border-strong));background:hsl(var(--card));font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:hsl(var(--accent))}
.btn.pri{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.btn.pri:hover{background:hsl(var(--primary)/.9)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:hsl(var(--accent))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge svg{width:13px;height:13px}
.t-success{background:hsl(var(--success-subtle));color:hsl(var(--success-strong))}
.t-warning{background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong))}
.t-danger{background:hsl(var(--danger-subtle));color:hsl(var(--danger-strong))}
.t-info{background:hsl(var(--info-subtle));color:hsl(var(--info-strong))}
.t-neutral{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.tx-danger{color:hsl(var(--danger-strong))}.tx-warning{color:hsl(var(--warning-strong))}.tx-success{color:hsl(var(--success-strong))}
.inline{display:inline-flex;align-items:center;gap:6px}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid hsl(var(--border))}
.card-h h2{flex:1}
.card-b{padding:16px}

/* setor e contadores */
.setores{display:flex;gap:8px;flex-wrap:wrap}
.setor-tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--card));text-align:left;min-width:180px}
.setor-tab.on{border-color:hsl(var(--primary));box-shadow:0 0 0 1px hsl(var(--primary))}
.setor-tab b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid hsl(var(--border));background:hsl(var(--card));text-align:left}
.kpi:hover{border-color:hsl(var(--border-strong))}
.kpi .v{font-size:26px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{display:flex;align-items:center;gap:6px;color:hsl(var(--muted-foreground));font-weight:500}
.kpi.hero{background:hsl(var(--warning-subtle));border-color:hsl(var(--warning)/.45)}
.kpi.hero .v,.kpi.hero .l{color:hsl(var(--warning-strong))}
.kpi.on{box-shadow:0 0 0 2px hsl(var(--primary))}

.tabs{display:flex;gap:2px;border-bottom:1px solid hsl(var(--border));overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:10px 12px;font-weight:600;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:hsl(var(--foreground));border-bottom-color:hsl(var(--primary))}
.tab .cnt{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.tab .cnt.w{background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong))}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .sp{flex:1}

.tw{overflow-x:auto;border:1px solid hsl(var(--border));border-radius:12px;background:hsl(var(--card))}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;font-weight:600;text-align:left;color:hsl(var(--muted-foreground));padding:9px 12px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--canvas));white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid hsl(var(--border));vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:hsl(var(--accent)/.5)}
tr.grp td{background:hsl(var(--canvas));font-weight:600;padding:8px 12px}
td.r,th.r{text-align:right}
.svc b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:2px 7px;border-radius:6px;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-success{background:hsl(var(--success))}.d-warning{background:hsl(var(--warning))}.d-info{background:hsl(var(--info))}.d-danger{background:hsl(var(--danger))}.d-neutral{background:hsl(var(--muted-foreground))}

.pessoa{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-bottom:12px}
.pessoa-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:hsl(var(--canvas));border:1px solid hsl(var(--border));border-bottom:0;border-radius:12px 12px 0 0}
.pessoa-h + .tw{border-radius:0 0 12px 12px}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:hsl(var(--muted));min-width:120px}
.bar span{display:block}

.alerta{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong))}
.alerta.neutro{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.alerta .tx{flex:1;min-width:0}
.alerta .tx b{display:block}

.status-ctl{display:inline-flex;align-items:center;gap:6px}
.grid-d{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px}
.kv dt{color:hsl(var(--muted-foreground))}
.kv dd{margin:0;min-width:0}
.outro{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid hsl(var(--border))}
.outro:last-child{border-bottom:0;padding-bottom:0}
.outro:first-child{padding-top:0}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:12px;padding-bottom:18px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:1px;background:hsl(var(--border))}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.tl .tx{padding-top:5px;min-width:0}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:48px 16px;color:hsl(var(--muted-foreground))}
.empty svg{width:28px;height:28px}
.empty b{color:hsl(var(--foreground))}
.note-wf{border:1px dashed hsl(var(--muted-foreground)/.6);border-radius:10px;padding:10px 12px;font-size:12px;line-height:17px;color:hsl(var(--muted-foreground));background:hsl(var(--canvas))}
.note-wf b{color:hsl(var(--foreground))}

/* modal */
.scrim{position:fixed;inset:0;background:hsl(222 47% 11%/.4);display:grid;place-items:center;padding:16px;z-index:20}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:14px;box-shadow:var(--shadow-lg)}
.modal-h{padding:18px 20px 12px;display:flex;flex-direction:column;gap:4px}
.modal-b{padding:4px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid hsl(var(--border))}
.modal-f .sp{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:600;font-size:13px}
.inp{height:36px;padding:0 10px;border:1px solid hsl(var(--border-strong));border-radius:8px;background:hsl(var(--background));width:100%}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.pick{display:flex;flex-direction:column;border:1px solid hsl(var(--border));border-radius:10px;max-height:220px;overflow-y:auto}
.pick button{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid hsl(var(--border));background:none;padding:8px 10px;text-align:left}
.pick button:last-child{border-bottom:0}
.pick button:hover{background:hsl(var(--accent))}
.pick button.on{background:hsl(var(--primary)/.09)}
.pick .carga{margin-left:auto;display:flex;gap:4px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.quick button.on{border-color:hsl(var(--primary));color:hsl(var(--primary));background:hsl(var(--primary)/.08)}
.parte{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid hsl(var(--border));border-radius:10px}
.parte .field>label{font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:16px}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tipo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));text-align:left}
.tipo svg{color:hsl(var(--muted-foreground));margin-bottom:2px}
.tipo.on{border-color:hsl(var(--primary));box-shadow:0 0 0 1px hsl(var(--primary));background:hsl(var(--primary)/.05)}
.tipo.on svg{color:hsl(var(--primary))}
.preview{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:hsl(var(--canvas));border:1px dashed hsl(var(--border-strong))}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 10px 6px 6px;border-radius:999px;font-weight:600;color:hsl(var(--muted-foreground))}
.steps button:disabled{cursor:default}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:hsl(var(--muted))}
.steps .n svg{width:13px;height:13px}
.steps li.on button{color:hsl(var(--foreground));background:hsl(var(--primary)/.08)}
.steps li.on .n{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.steps li.ok .n{background:hsl(var(--success-subtle));color:hsl(var(--success-strong))}
.svc-row{grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,.9fr) auto;align-items:start}
.svc-row .btn{margin-top:26px}
tr.alerta-linha td{background:hsl(var(--warning-subtle)/.45)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.board.b3{grid-auto-columns:minmax(260px,1fr)}
.col{background:hsl(var(--canvas));border:1px solid hsl(var(--border));border-radius:12px;display:flex;flex-direction:column;min-height:240px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px}
.col-h .sp{flex:1}

const ATIVA = (t) => t.status === 'aberta' || t.status === 'em_andamento';
const etapa = (s) => {
  const ts = s.tarefas.filter((t) => t.status !== 'cancelada');
  if (!s.tarefas.length) return 'na_fila';
  if (ts.length && ts.every((t) => t.status === 'concluida')) return 'concluido';
  if (ts.some((t) => t.status === 'em_andamento' || t.status === 'concluida')) return 'em_execucao';
  return 'distribuido';
};
const prazoServico = (s) => {
  const ps = s.tarefas.filter((t) => t.status !== 'cancelada' && t.prazo).map((t) => dt(t.prazo));
  return ps.length ? new Date(Math.max(...ps)) : null;
};
const situacaoPrazo = (prazo) => {
  if (!prazo) return 'sem_prazo';
  const d = dias(HOJE, prazo);
  if (d < 0) return 'atrasado';
  if (d <= 7) return 'vence_7_dias';
  return 'depois';
};
const ultimaMov = (s) => dt(s.mov || s.chegou);
const diasSemMov = (s) => dias(ultimaMov(s));
const cienciaVigente = (s) => !!s.ciencia && dt(s.ciencia.em) >= ultimaMov(s) && dias(dt(s.ciencia.em)) < 7;
const emAlerta = (s) => ['distribuido', 'em_execucao'].includes(etapa(s)) && diasSemMov(s) >= 7 && !cienciaVigente(s);
const ativo = (s) => ['na_fila', 'distribuido', 'em_execucao'].includes(etapa(s));
const atrasado = (s) => ativo(s) && etapa(s) !== 'na_fila' && situacaoPrazo(prazoServico(s)) === 'atrasado';
const responsaveis = (s) => [...new Set(s.tarefas.filter((t) => t.status !== 'cancelada').map((t) => PESSOAS[t.resp].nome))];
const doSetor = (setor) => SERVICOS.filter((s) => s.setor === setor);
/* Visibilidade do backend: os.ver_todas, servicos.ver_setor no setor, ou tarefa própria. */
const vejo = (s) => pode('os.ver_todas') || setoresQueAcompanho().some((x) => x.id === s.setor) || s.tarefas.some((t) => t.resp === S.persona.pessoa);
const termino = (s) => new Date(Math.max(...s.tarefas.filter((t) => t.termino).map((t) => dt(t.termino))));

const contadores = (setor) => {
  const ss = doSetor(setor);
  return {
    na_fila: ss.filter((s) => etapa(s) === 'na_fila').length,
    em_andamento: ss.filter((s) => ['distribuido', 'em_execucao'].includes(etapa(s))).length,
    atrasados: ss.filter(atrasado).length,
    em_alerta: ss.filter(emAlerta).length,
    sem_prazo: ss.filter((s) => ['distribuido', 'em_execucao'].includes(etapa(s)) && !prazoServico(s)).length,
  };
};

   - Cartões e linhas com menos informação: serviço, cliente, responsável e UMA situação; o resto fica no detalhe.
   - Legenda em "Como ler" para explicar cada marca. */

function tarefasAtivasDoSetor(setor) {
  return doSetor(setor.id).flatMap((s) => s.tarefas.filter(ATIVA).map((t) => ({ s, t })));
}
function equipeDoSetor(setor) {
  const membros = Object.entries(PESSOAS).filter(([, p]) => p.setor === setor.id).map(([k]) => k);
  return membros.map((k) => {
    const ls = tarefasAtivasDoSetor(setor).filter(({ t }) => t.resp === k);
    const sit = (l) => situacaoPrazo(l.t.prazo && dt(l.t.prazo));
    return {
      k, ...PESSOAS[k], ativos: ls.length,
      atrasados: ls.filter((l) => sit(l) === 'atrasado').length,
      vence7: ls.filter((l) => sit(l) === 'vence_7_dias').length,
      semPrazo: ls.filter((l) => sit(l) === 'sem_prazo').length,
      alerta: ls.filter((l) => emAlerta(l.s)).length,
      antigo: ls.length ? Math.max(...ls.map((l) => dias(dt(l.t.criada)))) : null,
    };
  });
}

const PRESETS = {
  semana: ['Esta semana', new Date(2026, 9, 5), new Date(2026, 9, 11)],
  prox7: ['Próximos 7 dias', new Date(2026, 9, 10), new Date(2026, 9, 17)],

};

const CAMPOS_DATA_MEUS = { prazo: 'Prazo', conclusao: 'Conclusão' };
function intervalo(f) {
  if (!f.dataCampo || !f.dataPreset) return null;
  if (f.dataPreset === 'personalizado') return f.de || f.ate ? [f.de ? new Date(f.de + 'T00:00') : new Date(2000, 0, 1), f.ate ? new Date(f.ate + 'T23:59') : new Date(2100, 0, 1)] : null;
  return [PRESETS[f.dataPreset][1], new Date(PRESETS[f.dataPreset][2].getTime() + 86399999)];
}
const rotuloData = (f, campos) => {
  if (!intervalo(f)) return null;
  const per = f.dataPreset === 'personalizado' ? `${f.de ? fmtC(new Date(f.de + 'T12:00')) : '…'} a ${f.ate ? fmtC(new Date(f.ate + 'T12:00')) : '…'}` : PRESETS[f.dataPreset][0].toLowerCase();
  return `${campos[f.dataCampo]}: ${per}`;
};
const dentro = (d, r) => !!d && d >= r[0] && d <= r[1];

/* Uma situação por item, em palavras (a mais importante primeiro) */
function situacoes(s, prazo, encerrado) {
  const out = [];
  if (encerrado) return out;
  if (prazo) {
    const d = dias(HOJE, prazo);
    if (d < 0) out.push(['danger', 'triangle-alert', `Atrasado ${pl(-d, 'dia', 'dias')}`, 'Passou do prazo e não foi concluído.']);
    else if (d === 0) out.push(['warning', 'clock', 'Vence hoje', 'O prazo é hoje.']);
    else if (d <= 7) out.push(['warning', 'clock', `Vence ${fmtC(prazo)}`, 'Vence nos próximos 7 dias.']);
    else out.push(['neutral', 'calendar', `Prazo ${fmtC(prazo)}`, 'Dentro do prazo.']);
  } else out.push(['warning', 'calendar-x', 'Sem prazo', 'Ninguém definiu prazo ao distribuir.']);
  if (cienciaVigente(s)) out.push(['neutral', 'bell-off', MOTIVOS[s.ciencia.motivo], `${PESSOAS[s.ciencia.por].nome} confirmou em ${fmtC(dt(s.ciencia.em))} que está tudo bem. O aviso de parado fica silenciado por 7 dias.`]);
  else if (emAlerta(s)) out.push(['warning', 'hourglass', `Parado há ${pl(diasSemMov(s), 'dia', 'dias')}`, 'Nenhuma mudança nas tarefas há 7 dias ou mais.']);
  return out;
}

    ${S.pop === id ? `<div class="fpop" role="dialog" aria-label="${rotulo}">${popover(id, f)}</div>` : ''}</span>`;

function popover(id, f) {
  const opc = (campo, v, txt, extra = '') => `<button class="fopt ${f[campo] === v ? 'on' : ''}" data-fsel="${campo}:${v ?? ''}">${f[campo] === v ? I('check') : '<span class="ck"></span>'}<span class="fo-t">${txt}</span>${extra}</button>`;
  if (id === 'pessoa') {
    const eq = equipeDoSetor(SETORES.find((x) => x.id === S.setor));
    return `<div class="fpop-h">Responsável</div>${opc('pessoa', null, 'Todas as pessoas')}
      ${eq.map((e) => opc('pessoa', e.k, `<span class="inline"><span class="av sm">${iniciais(e.nome)}</span>${esc(e.nome)}</span>`, `<span class="fo-x num">${pl(e.ativos, 'ativo', 'ativos')}${e.atrasados ? ` · <span class="tx-danger">${e.atrasados} atras.</span>` : ''}</span>`)).join('')}
      <div class="fpop-n">Itens ativos e atrasados de cada pessoa: a carga da equipe.</div>`;
  }
  if (id === 'cliente') {
    const base = S.rota === 'meus-servicos' ? SERVICOS.filter((s) => s.tarefas.some((t) => t.resp === S.persona.pessoa)) : doSetor(S.setor);
    const cls = [...new Set(base.map((s) => OS[s.os].cliente))].sort();
    return `<div class="fpop-h">Cliente</div>${opc('cliente', null, 'Todos os clientes')}${cls.map((c) => opc('cliente', c, esc(c))).join('')}`;
  }
  if (id === 'prioridade') return `<div class="fpop-h">Prioridade da venda</div>${opc('prioridade', null, 'Todas')}${Object.entries(PRIOR).map(([k, v]) => opc('prioridade', k, v[2])).join('')}`;
  if (id === 'agrupar') {
    const ops = vis() === 'quadro' ? [['nenhum', 'Colunas por etapa'], ['pessoa', 'Raias por pessoa']] : [['nenhum', 'Sem agrupar'], ['pessoa', 'Por pessoa'], ['cliente', 'Por cliente']];
    return `<div class="fpop-h">Agrupar</div>${ops.map(([v, t]) => opc('agrupar', v, t)).join('')}`;
  }
  if (id === 'data') {
    const campos = S.rota === 'meus-servicos' ? CAMPOS_DATA_MEUS : CAMPOS_DATA_SETOR;
    return `<div class="fpop-h">Filtrar pela data de</div><div class="seg seg-w">${Object.entries(campos).map(([k, v]) => `<button class="${(f.dataCampo || 'prazo') === k ? 'on' : ''}" data-fsel="dataCampo:${k}">${v}</button>`).join('')}</div>
      <div class="fpop-h">Período</div>${Object.entries(PRESETS).map(([k, [t, a, b]]) => opc('dataPreset', k, t, `<span class="fo-x num">${fmtC(a)} a ${fmtC(b)}</span>`)).join('')}
      ${opc('dataPreset', 'personalizado', 'Personalizado')}
      ${f.dataPreset === 'personalizado' ? `<div class="grid2" style="padding:6px 8px 2px"><label class="field" for="f-de"><span class="sm muted">De</span><input class="inp" type="date" id="f-de" data-fdata="de" value="${f.de}"></label><label class="field" for="f-ate"><span class="sm muted">Até</span><input class="inp" type="date" id="f-ate" data-fdata="ate" value="${f.ate}"></label></div>` : ''}
      <div class="fpop-f"><button class="btn ghost sm" data-fclear="data">Limpar data</button><button class="btn sm pri" data-pop="">Aplicar</button></div>`;
  }
  if (id === 'ajuda') return legenda();
  return '';
}
function legenda() {
  const l = (c, txt) => `<div class="leg">${c}<span>${txt}</span></div>`;
  return `<div class="fpop-h">Como ler os cartões</div>
    ${l(chip(['danger', 'triangle-alert', 'Atrasado 5 dias', '']), 'Passou do prazo e não foi concluído. O cartão ganha uma faixa vermelha.')}
    ${l(chip(['warning', 'clock', 'Vence 14/10', '']), 'Vence nos próximos 7 dias.')}
    ${l(chip(['neutral', 'calendar', 'Prazo 24/10', '']), 'Dentro do prazo.')}
    ${l(chip(['warning', 'calendar-x', 'Sem prazo', '']), 'Distribuído sem prazo.')}
    ${l(chip(['warning', 'hourglass', 'Parado há 9 dias', '']), 'Nenhuma mudança nas tarefas há 7 dias ou mais. Não é erro: é um aviso.')}
    ${l(chip(['neutral', 'bell-off', 'Aguardando o cliente', '']), 'Alguém confirmou que o serviço está esperando algo. O aviso de parado fica silenciado por 7 dias.')}
    ${l(`<span class="tx-danger inline">${I('chevrons-up')}</span>`, 'Venda com prioridade alta.')}
    ${l(avatares(['rafael']), 'Quem está com o serviço.')}
    ${S.rota === 'setor' && pode('tarefas.distribuir') ? l(`<span class="inline muted">${I('grip-vertical')}</span>`, 'Arraste um cartão da fila para “Distribuído” (ou para a raia de alguém) para distribuir.') : ''}
    ${S.rota === 'meus-servicos' ? l(`<span class="inline muted">${I('grip-vertical')}</span>`, 'Arraste o cartão entre as colunas para mudar o status, ou use o botão do cartão.') : ''}`;
}
function barraFiltros(opcoes) {
  const f = F();
  const campos = S.rota === 'meus-servicos' ? CAMPOS_DATA_MEUS : CAMPOS_DATA_SETOR;
  const ativos = [];
  if (f.pessoa) ativos.push(['pessoa', `Pessoa: ${PESSOAS[f.pessoa].nome}`]);
  if (f.cliente) ativos.push(['cliente', `Cliente: ${f.cliente}`]);
  if (f.prioridade) ativos.push(['prioridade', `Prioridade: ${PRIOR[f.prioridade][2]}`]);
  if (rotuloData(f, campos)) ativos.push(['data', rotuloData(f, campos)]);
  if (f.q) ativos.push(['q', `Busca: “${f.q}”`]);
  const chave = S.rota === 'meus-servicos' ? 'visMeus' : 'visPainel';
  const agr = { nenhum: null, pessoa: vis() === 'quadro' ? 'Raias por pessoa' : 'Por pessoa', cliente: 'Por cliente' }[f.agrupar];
  return `<div class="fbar">
      <span class="seg" role="group" aria-label="Visualização"><button class="${S[chave] === 'quadro' ? 'on' : ''}" data-vis="${chave}:quadro" title="Colunas por etapa">${I('columns-3')}Quadro</button><button class="${S[chave] === 'lista' ? 'on' : ''}" data-vis="${chave}:lista" title="Tabela">${I('list')}Lista</button></span>
      <span class="vsep"></span>
      ${opcoes.includes('pessoa') ? botaoFiltro('pessoa', 'user', 'Pessoa', f.pessoa ? PESSOAS[f.pessoa].nome.split(' ')[0] : null) : ''}
      ${botaoFiltro('cliente', 'building-2', 'Cliente', f.cliente ? f.cliente.split(' ').slice(0, 2).join(' ') : null)}
      ${opcoes.includes('prioridade') ? botaoFiltro('prioridade', 'chevrons-up', 'Prioridade', f.prioridade ? PRIOR[f.prioridade][2] : null) : ''}
      ${botaoFiltro('data', 'calendar-range', 'Data', intervalo(f) ? (f.dataPreset === 'personalizado' ? 'personalizado' : PRESETS[f.dataPreset][0]) : null)}
      ${opcoes.includes('agrupar') ? botaoFiltro('agrupar', 'rows-3', 'Agrupar', agr) : ''}
      <span class="sp"></span>
      <label class="fsearch" for="f-q">${I('search')}<input id="f-q" data-fq value="${esc(f.q)}" placeholder="Buscar serviço, cliente ou OS"></label>
      ${botaoFiltro('ajuda', 'circle-help', 'Como ler', null).replace('fwrap', 'fwrap fwrap-r')}
    </div>
    ${ativos.length ? `<div class="fchips">${ativos.map(([k, t]) => `<span class="fchip">${esc(t)}<button data-fclear="${k}" aria-label="Remover filtro">${I('x')}</button></span>`).join('')}<button class="btn ghost sm" data-flimpar>Limpar filtros</button></div>` : ''}`;
}

/* ── Indicadores clicáveis ── */
function indicadores(lista, titulo) {
  const f = F();
  return `<div class="kpi-h"><h2>${titulo}</h2><span class="sm muted">Clique num indicador para ver só aqueles itens</span></div>
    <div class="kpis2" role="group" aria-label="Indicadores">${lista.map(([id, rot, ic, tom, n, dica]) => {
      const on = f.foco === id;
      return `<button class="kpi2 ${on ? 'on' : ''}" data-foco="${id}" aria-pressed="${on}" title="${esc(dica)}${on && vis() === 'quadro' ? ' Clique de novo para ver todos.' : ''}">
        <span class="k-l"><span class="k-ic t-${tom}">${I(ic)}</span>${rot}</span>
        <span class="k-v num ${tom === 'danger' && n ? 'tx-danger' : ''}">${n}</span>
        <span class="k-a ${!n && !on ? 'zero' : ''}">${on ? `${I('check')}Mostrando estes` : n ? `Ver ${n === 1 ? 'este' : 'estes'}${I('arrow-right')}` : 'Nenhum agora'}</span>
      </button>`;
    }).join('')}</div>`;
}

/* ───────────────── Painel do setor ───────────────── */
const ETAPAS_COL = [['na_fila', 'Para distribuir', 'warning'], ['distribuido', 'Distribuído', 'neutral'], ['em_execucao', 'Em execução', 'info'], ['concluido', 'Concluído no mês', 'success']];
const FOCO_SETOR = {
  fila: (s) => etapa(s) === 'na_fila',
  andamento: (s) => ['distribuido', 'em_execucao'].includes(etapa(s)),
  atrasados: atrasado,
  parados: emAlerta,
  concluidos: (s) => etapa(s) === 'concluido',
};
function servicosDoPainel(setor, ignorarFoco) {
  const f = S.fp; const r = intervalo(f);
  const q = f.q.trim().toLowerCase();
  return doSetor(setor.id).filter((s) => {
    const e = etapa(s);
    if (e === 'cancelado') return false;
    if (e === 'concluido' && termino(s) < INICIO_MES && !(r && f.dataCampo === 'conclusao')) return false;
    if (q && !`${s.cat} ${s.desc} ${OS[s.os].cliente} ${s.os}`.toLowerCase().includes(q)) return false;
    if (f.pessoa && !s.tarefas.some((t) => t.resp === f.pessoa && t.status !== 'cancelada')) return false;
    if (f.cliente && OS[s.os].cliente !== f.cliente) return false;
    if (f.prioridade && OS[s.os].prioridade !== f.prioridade) return false;
    if (r) {
      const campo = f.dataCampo || 'prazo';
      const d = campo === 'prazo' ? prazoServico(s) : campo === 'chegada' ? dt(s.chegou) : (e === 'concluido' ? termino(s) : null);
      if (!dentro(d, r)) return false;
    }
    if (!ignorarFoco && f.foco && !FOCO_SETOR[f.foco](s)) return false;
    return true;
  });
}

function paginaSetor() {
  const acompanha = setoresQueAcompanho();
  if (!acompanha.length) return empty('lock', 'Você não acompanha nenhum setor', 'O painel aparece para quem tem a permissão de ver os serviços de um setor.');
  if (!acompanha.some((s) => s.id === S.setor)) S.setor = acompanha[0].id;
  const setor = SETORES.find((s) => s.id === S.setor);
  const organiza = pode('tarefas.distribuir');
  if (S.visPainel === 'lista' && !S.fp.foco) S.fp.foco = 'fila';
  const base = servicosDoPainel(setor, true);
  const n = (k) => base.filter(FOCO_SETOR[k]).length;
  const kpis = [
    ['fila', 'Para distribuir', 'inbox', 'warning', n('fila'), 'Chegaram ao setor e ainda não têm responsável.'],
    ['andamento', 'Em andamento', 'circle-dot', 'info', n('andamento'), 'Distribuídos ou em execução.'],
    ['atrasados', 'Atrasados', 'triangle-alert', 'danger', n('atrasados'), 'Passaram do prazo e não foram concluídos.'],
    ['parados', 'Parados', 'hourglass', 'warning', n('parados'), 'Sem nenhuma mudança há 7 dias ou mais, sem ciência.'],
    ['concluidos', 'Concluídos no mês', 'circle-check', 'success', n('concluidos'), 'Todas as tarefas concluídas neste mês.'],
  ];
  return `
    <div class="ph"><div class="t"><h1>Painel do setor</h1><span class="muted">O que chegou, o que está com quem e o que precisa de atenção.</span></div>
      ${acompanha.length > 1 ? `<label class="inline" for="sel-setor"><span class="sm muted">Setor</span><select class="inp" id="sel-setor" data-sel-setor style="width:auto;height:34px">${acompanha.map((s) => `<option value="${s.id}" ${s.id === S.setor ? 'selected' : ''}>${esc(s.nome)} (${contadores(s.id).na_fila} na fila)</option>`).join('')}</select></label>` : `<span class="inline muted">${I('network')}${esc(setor.nome)}</span>`}
    </div>
    ${setor.semOrganizador ? `<div class="alerta">${I('user-x')}<div class="tx"><b>Este setor ainda não tem quem organize</b>Nenhum membro de ${esc(setor.nome)} tem as permissões de acompanhar e distribuir. A diretoria distribui enquanto as funções são configuradas.</div><button class="btn sm">Configurar funções</button></div>` : ''}
    ${indicadores(kpis, 'Resumo do setor')}
    ${barraFiltros(['pessoa', 'prioridade', 'agrupar'])}
    ${S.visPainel === 'quadro' ? quadroSetor(setor, organiza) : listaSetor(setor, organiza)}`;
}

function kcardServico(s, organiza) {
  const e = etapa(s); const o = OS[s.os];
  const arrasta = e === 'na_fila' && organiza;
  let pe;
  if (e === 'na_fila') {
    const na = dias(dt(s.chegou));
    pe = `<span class="sm ${na >= 5 ? 'tx-warning' : 'muted'}" title="Desde que a venda chegou ao setor">${na === 0 ? 'Chegou hoje' : `Na fila há ${pl(na, 'dia', 'dias')}`}</span>${organiza ? `<button class="btn sm pri" data-distribuir="${s.id}" data-stop>Distribuir</button>` : ''}`;
  } else if (e === 'concluido') {
    const p = prazoServico(s); const tm = termino(s);
    pe = `<span class="sm muted">${esc(quemConcluiu(s))}</span>${p && tm > p ? chip(['danger', 'triangle-alert', `${pl(dias(p, tm), 'dia', 'dias')} após o prazo`, 'Concluído depois do prazo.']) : chip(['success', 'circle-check', fmtC(tm), 'Data de conclusão.'])}`;
  } else {
    pe = `${avatares(respsDe(s))}<span class="k-chips">${situacoes(s, prazoServico(s), false).map(chip).join('')}</span>`;
  }
  return `<article class="kcard ${atrasado(s) ? 'k-atr' : ''} ${arrasta ? 'k-drag' : ''}" data-ir="servico-${s.id}" tabindex="0" ${arrasta ? `draggable="true" data-drag="${s.id}"` : ''} title="${esc(s.desc)}">
    <div class="k-top"><b>${esc(s.cat)}</b>${o.prioridade === 'alta' ? `<span class="tx-danger" title="Prioridade alta">${I('chevrons-up')}</span>` : ''}<span class="sp"></span><span class="sm muted num">OS ${s.os}</span></div>
    <span class="k-cli">${esc(o.cliente)}</span>
    <div class="k-foot">${pe}</div>
  </article>`;
}
function ordenar2(col, ss) {
  if (col === 'na_fila') return ss.sort((a, b) => dt(a.chegou) - dt(b.chegou));
  if (col === 'concluido') return ss.sort((a, b) => termino(b) - termino(a));
  const peso = (s) => (atrasado(s) ? 0 : emAlerta(s) ? 1 : 2);
  return ss.sort((a, b) => peso(a) - peso(b) || (prazoServico(a) || Infinity) - (prazoServico(b) || Infinity));
}
function quadroSetor(setor, organiza) {
  const ss = servicosDoPainel(setor, false);
  const f = S.fp;
  const cols = ETAPAS_COL.filter(([id]) => !f.foco || ss.some((s) => etapa(s) === id) || (id === 'distribuido' && f.foco === 'fila' && organiza));
  const cab = ([id, t, tom], n) => `<div class="col-h"><span class="dot d-${tom}"></span><b>${t}</b><span class="cnt n">${n}</span></div>`;
  if (f.agrupar !== 'pessoa') {
    return `<div class="board" style="grid-template-columns:repeat(${cols.length},minmax(250px,1fr))">${cols.map((c) => {
      const lista = ordenar2(c[0], ss.filter((s) => etapa(s) === c[0]));
      const soltar = c[0] === 'distribuido' && organiza;
      return `<section class="col" ${soltar ? 'data-drop="pessoa:"' : ''} aria-label="${c[1]}">${cab(c, lista.length)}
        <div class="col-b">${lista.map((s) => kcardServico(s, organiza)).join('') || `<p class="col-vazia">${soltar ? 'Arraste um cartão da fila para cá para distribuir.' : 'Nada aqui.'}</p>`}</div></section>`;
    }).join('')}</div>`;
  }
  const eq = equipeDoSetor(setor).filter((e) => !f.pessoa || e.k === f.pessoa);
  const fila = ordenar2('na_fila', ss.filter((s) => etapa(s) === 'na_fila'));
  const cols3 = ETAPAS_COL.slice(1);
  return `<div class="raias-layout">
    <section class="col fila-lateral" aria-label="Para distribuir">${cab(ETAPAS_COL[0], fila.length)}<div class="col-b">${fila.map((s) => kcardServico(s, organiza)).join('') || '<p class="col-vazia">Nada para distribuir.</p>'}</div></section>
    <div class="lanes-wrap"><div class="lanes">
      ${cols3.map((c) => `<div class="lanes-h">${cab(c, ss.filter((s) => etapa(s) === c[0]).length)}</div>`).join('')}
      ${eq.map((e) => {
        const dela = ss.filter((s) => etapa(s) !== 'na_fila' && s.tarefas.some((t) => t.resp === e.k && t.status !== 'cancelada'));
        return `<div class="lane-h"><span class="av sm">${iniciais(e.nome)}</span><b>${esc(e.nome)}</b><span class="sm muted">${esc(e.funcao)} · ${pl(e.ativos, 'ativo', 'ativos')}</span>${e.atrasados ? chip(['danger', 'triangle-alert', `${e.atrasados} atrasado${e.atrasados > 1 ? 's' : ''}`, 'Itens atrasados desta pessoa.']) : ''}</div>
          ${cols3.map(([col]) => {
            const lista = ordenar2(col, dela.filter((s) => etapa(s) === col));
            const soltar = col === 'distribuido' && organiza;
            return `<div class="cell" ${soltar ? `data-drop="pessoa:${e.k}"` : ''}>${lista.map((s) => kcardServico(s, organiza)).join('') || (soltar ? `<p class="col-vazia">Solte aqui para distribuir para ${esc(e.nome.split(' ')[0])}.</p>` : '')}</div>`;
          }).join('')}`;
      }).join('')}
    </div></div></div>`;
}

function listaSetor(setor, organiza) {
  const f = S.fp;
  const ss = servicosDoPainel(setor, false);
  if (!ss.length) return empty('search-x', 'Nada com estes filtros', 'Mude o indicador selecionado ou limpe os filtros.');
  const tipo = f.foco === 'fila' ? 'fila' : f.foco === 'concluidos' ? 'concluidos' : 'andamento';
  const head = {
    fila: '<th>Serviço</th><th>Cliente</th><th>OS</th><th>Na fila há</th><th>Prioridade</th><th></th>',
    andamento: '<th>Serviço</th><th>Cliente</th><th>OS</th><th>Responsável</th><th>Situação</th><th></th>',
    concluidos: '<th>Serviço</th><th>Cliente</th><th>OS</th><th>Concluído por</th><th>Término</th><th>Prazo</th>',
  }[tipo];
  const linha = (s) => {
    const o = OS[s.os];
    const base = `<td><b>${esc(s.cat)}</b></td><td>${esc(o.cliente)}</td><td class="num muted">${s.os}</td>`;
    if (tipo === 'fila') {
      const na = dias(dt(s.chegou));
      return `${base}<td class="num ${na >= 5 ? 'tx-warning' : ''}">${na === 0 ? 'Chegou hoje' : pl(na, 'dia', 'dias')}</td><td>${bPrior(o.prioridade)}</td><td class="r">${organiza ? `<button class="btn sm pri" data-distribuir="${s.id}" data-stop>Distribuir</button>` : ''}</td>`;
    }
    if (tipo === 'concluidos') {
      const p = prazoServico(s); const tm = termino(s);
      return `${base}<td>${esc(quemConcluiu(s))}</td><td class="num">${fmt(tm)}</td><td>${p ? (tm <= p ? chip(['success', 'circle-check', 'No prazo', `Prazo ${fmt(p)}`]) : chip(['danger', 'triangle-alert', `${pl(dias(p, tm), 'dia', 'dias')} após`, `Prazo ${fmt(p)}`])) : '<span class="sm muted">Sem prazo</span>'}</td>`;
    }
    return `${base}<td>${respsDe(s).map((k) => esc(PESSOAS[k].nome)).join('<br>')}</td><td><span class="k-chips">${situacoes(s, prazoServico(s), false).map(chip).join('')}</span></td>
      <td class="r">${emAlerta(s) ? `<button class="btn sm" data-ciencia="${s.id}" data-stop title="Confirmar que está tudo bem e silenciar o aviso por 7 dias">Estou ciente</button>` : ''}</td>`;
  };
  const col = tipo === 'fila' ? 'na_fila' : tipo === 'concluidos' ? 'concluido' : 'em_execucao';
  const ordenados = ordenar2(col, ss);
  let corpo;
  if (f.agrupar === 'nenhum') corpo = ordenados.map((s) => `<tr class="click" data-ir="servico-${s.id}">${linha(s)}</tr>`).join('');
  else {
    const chave = (s) => f.agrupar === 'cliente' ? [OS[s.os].cliente] : (respsDe(s).length ? respsDe(s).map((k) => PESSOAS[k].nome) : ['Sem responsável']);
    const g = {};
    ordenados.forEach((s) => chave(s).forEach((k) => (g[k] ||= []).push(s)));
    corpo = Object.keys(g).sort().map((k) => `<tr class="grp"><td colspan="6">${esc(k)} <span class="muted">· ${g[k].length}</span></td></tr>${g[k].map((s) => `<tr class="click" data-ir="servico-${s.id}">${linha(s)}</tr>`).join('')}`).join('');
  }
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${corpo}</tbody></table></div>`;
}

/* ───────────────── Meus serviços ───────────────── */
const FOCO_MEUS = {
  ativos: (l) => ATIVA(l.t),
  atrasados: (l) => ATIVA(l.t) && situacaoPrazo(l.t.prazo && dt(l.t.prazo)) === 'atrasado',
  vence7: (l) => ATIVA(l.t) && situacaoPrazo(l.t.prazo && dt(l.t.prazo)) === 'vence_7_dias',
  concluidos: (l) => l.t.status === 'concluida',
};
function minhasTarefas(ignorarFoco) {
  const f = S.fm; const r = intervalo(f); const q = f.q.trim().toLowerCase();
  return SERVICOS.flatMap((s) => s.tarefas.filter((t) => t.resp === S.persona.pessoa).map((t) => ({ s, t }))).filter((l) => {
    const { s, t } = l;
    if (t.status === 'cancelada') return false;
    if (t.status === 'concluida' && dt(t.termino) < INICIO_MES && !(r && f.dataCampo === 'conclusao')) return false;
    if (q && !`${s.cat} ${s.desc} ${OS[s.os].cliente} ${s.os}`.toLowerCase().includes(q)) return false;
    if (f.cliente && OS[s.os].cliente !== f.cliente) return false;
    if (r) {
      const d = (f.dataCampo || 'prazo') === 'prazo' ? (t.prazo && dt(t.prazo)) : (t.termino && dt(t.termino));
      if (!dentro(d, r)) return false;
    }
    if (!ignorarFoco && f.foco && !FOCO_MEUS[f.foco](l)) return false;
    return true;
  });
}
function kcardTarefa({ s, t }) {
  const o = OS[s.os]; const enc = t.status === 'concluida';
  const acao = t.status === 'aberta' ? `<button class="btn sm" data-status="${t.id}:em_andamento" data-stop>Iniciar</button>`
    : t.status === 'em_andamento' ? `<button class="btn sm pri" data-status="${t.id}:concluida" data-stop>Concluir</button>` : '';
  const atr = !enc && situacaoPrazo(t.prazo && dt(t.prazo)) === 'atrasado';
  return `<article class="kcard k-drag ${atr ? 'k-atr' : ''}" data-ir="servico-${s.id}" tabindex="0" draggable="true" data-drag-t="${t.id}" title="${esc(t.desc ? `${t.desc}: ${s.desc}` : s.desc)}">
    <div class="k-top"><b>${esc(s.cat)}${t.desc ? ` <span class="muted" style="font-weight:500">· ${esc(t.desc)}</span>` : ''}</b>${o.prioridade === 'alta' ? `<span class="tx-danger" title="Prioridade alta">${I('chevrons-up')}</span>` : ''}<span class="sp"></span><span class="sm muted num">OS ${s.os}</span></div>
    <span class="k-cli">${esc(o.cliente)}</span>
    <div class="k-foot"><span class="k-chips">${enc ? chip(['success', 'circle-check', `Concluída ${fmtC(dt(t.termino))}`, 'Data de conclusão.']) : situacoes(s, t.prazo && dt(t.prazo), false).map(chip).join('')}</span>${acao}</div>
  </article>`;
}

  return `<div class="ph"><div class="t"><h1>Meus serviços</h1><span class="muted">O que está com você, o que vence primeiro e o que está atrasado.</span></div></div>
    ${indicadores(kpis, 'Seu resumo')}

/* ── Ações de status e arrastar ── */
function mudarStatus(tid, st) {
  const s = SERVICOS.find((sv) => sv.tarefas.some((t) => String(t.id) === String(tid)));
  const t = s.tarefas.find((tt) => String(tt.id) === String(tid));
  if (t.status === st) return;
  const reabriu = t.status === 'concluida';
  t.status = st; s.mov = '10/10';
  if (st === 'em_andamento' && !t.inicio) t.inicio = '10/10';
  if (st === 'concluida') { t.termino = '10/10'; if (!t.inicio) t.inicio = '10/10'; }
  if (st !== 'concluida') delete t.termino;
  toast(reabriu ? `${s.cat} reaberto.` : st === 'concluida' ? (etapa(s) === 'concluido' ? `${s.cat} concluído.` : 'Tarefa concluída.') : st === 'em_andamento' ? `${s.cat} iniciado.` : `${s.cat} voltou para A fazer.`);
  render();
}
document.addEventListener('dragstart', (ev) => {
  const c = ev.target.closest && ev.target.closest('[data-drag],[data-drag-t]');
  if (!c) return;
  ev.dataTransfer.setData('text/plain', JSON.stringify({ s: c.dataset.drag || null, t: c.dataset.dragT || null }));
  ev.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
  document.body.classList.add(c.dataset.drag ? 'arrastando-s' : 'arrastando-t');
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging,.drop-on').forEach((x) => x.classList.remove('dragging', 'drop-on'));
  document.body.classList.remove('arrastando-s', 'arrastando-t');
});
document.addEventListener('dragover', (ev) => {
  const z = ev.target.closest && ev.target.closest(document.body.classList.contains('arrastando-s') ? '[data-drop]' : '[data-drop-t]');
  if (!z) return;
  ev.preventDefault();
  document.querySelectorAll('.drop-on').forEach((x) => x !== z && x.classList.remove('drop-on'));
  z.classList.add('drop-on');
});
document.addEventListener('drop', (ev) => {
  const z = ev.target.closest && ev.target.closest('[data-drop],[data-drop-t]');
  if (!z) return;
  ev.preventDefault();
  let d = {};
  try { d = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch (e) { return; }
  document.querySelectorAll('.drop-on').forEach((x) => x.classList.remove('drop-on'));
  if (d.s && z.dataset.drop != null) return abrirDistribuir(+d.s, z.dataset.drop.split(':')[1] || null);
  if (d.t && z.dataset.dropT) return mudarStatus(d.t, z.dataset.dropT);
});

function eventosDoServico(s) {
  const ev = [];
  const o = OS[s.os];
  ev.push([dt(o.venda), PESSOAS[o.vendedor].nome, 'shopping-cart', 'info', `Venda registrada (OS ${s.os})`]);
  ev.push([dt(s.chegou), null, 'inbox', 'warning', `${s.cat} chegou a ${SETORES.find((x) => x.id === s.setor).nome}`]);
  s.tarefas.forEach((t) => {
    const quemDistribuiu = s.setor === 2 ? 'Paulo Roberto Andrade' : 'Mariana Souza Lima';
    ev.push([dt(t.criada), quemDistribuiu, 'user-check', 'info', `Distribuído para ${PESSOAS[t.resp].nome}${t.prazo ? `, prazo ${fmt(dt(s.prazoAlterado && s.prazoAlterado.de ? s.prazoAlterado.de : t.prazo))}` : ', sem prazo'}`]);
    if (t.inicio) ev.push([dt(t.inicio), PESSOAS[t.resp].nome, 'play', 'info', `${PESSOAS[t.resp].nome} iniciou ${s.cat}${t.desc ? ` (${t.desc})` : ''}`]);
    if (t.termino) ev.push([dt(t.termino), PESSOAS[t.resp].nome, 'circle-check', 'success', `${PESSOAS[t.resp].nome} concluiu ${s.cat}${t.desc ? ` (${t.desc})` : ''}`]);
  });
  if (s.prazoAlterado) { const pa = s.prazoAlterado; ev.push([dt(pa.em), PESSOAS[pa.por].nome, 'calendar-clock', 'warning', `Prazo de ${s.cat} (${PESSOAS[s.tarefas[0].resp].nome}) alterado de ${fmt(dt(pa.de))} para ${fmt(dt(pa.para))}`]); }
  if (s.ciencia) ev.push([dt(s.ciencia.em), PESSOAS[s.ciencia.por].nome, 'bell-off', 'neutral', `Sem movimentação há ${dias(ultimaMov(s), dt(s.ciencia.em))} dias: ${PESSOAS[s.ciencia.por].nome} está ciente (${MOTIVOS[s.ciencia.motivo].toLowerCase()})`]);
  if (etapa(s) === 'concluido') ev.push([termino(s), null, 'circle-check', 'success', `${s.cat} concluído`]);
  return ev;
}

/* Espelho de OrdemServico.condicao_resumo no backend: o mesmo texto em todas as telas e nos e-mails. */
function condicaoResumo(f) {
  const partes = [];
  if (f.tipo === 'parcelado') partes.push(`Parcelado em ${f.parcelas || '?'}x${f.intervalo ? ` a cada ${f.intervalo} dias` : ''}`);
  else if (f.tipo === 'recorrente') {
    partes.push(`Recorrente: ${f.meses || '?'} meses${f.mensal ? ` de ${fmtR(f.mensal)}` : ''}`);
    if (f.fecha) partes.push(`fecha dia ${f.fecha}`);
    if (f.vence) partes.push(`vence dia ${f.vence}`);
  } else partes.push('À vista');
  if (f.venc) partes.push(`1º vencimento ${fmt(dt(f.venc))}`);
  return partes.join(', ');
}

const servicosDaOS = (id) => SERVICOS.filter((s) => s.os === +id);
function andamentoOS(id) {
  const a = { total: 0, na_fila: 0, distribuido: 0, em_execucao: 0, concluido: 0, cancelado: 0 };
  servicosDaOS(id).forEach((s) => { a.total += 1; a[etapa(s)] += 1; });
  return a;
}
function statusOS(id) {
  const ss = servicosDaOS(id);
  if (ss.length && ss.every((s) => etapa(s) === 'concluido')) return 'concluida';
  if (ss.some((s) => ['em_execucao', 'concluido'].includes(etapa(s)))) return 'em_andamento';
  return 'aberta';
}
/* Liberação: uma vez, na venda ou quando todos os serviços terminam. */
function liberacao(id) {
  const o = OS[id]; const f = FIN[id];
  if (f.liberar === 'venda') return { liberada: true, em: dt(o.venda), por: PESSOAS[o.vendedor].nome, motivo: 'na venda' };
  if (statusOS(id) === 'concluida') {
    const ult = servicosDaOS(id).sort((a, b) => termino(b) - termino(a))[0];
    const t = ult.tarefas.filter((x) => x.termino).sort((a, b) => dt(b.termino) - dt(a.termino))[0];
    return { liberada: true, em: termino(ult), por: PESSOAS[t.resp].nome, motivo: 'todos os serviços concluídos' };
  }
  return { liberada: false };
}
const situacaoFin = (id) => FIN[id].lancado ? 'faturada' : liberacao(id).liberada ? 'a_faturar' : 'previsao';
const SIT_FIN = { previsao: ['neutral', 'circle-dashed', 'Previsão'], a_faturar: ['warning', 'clock', 'A faturar'], faturada: ['success', 'circle-check', 'Faturada'] };
const STATUS_OS = { aberta: ['warning', 'circle-dashed', 'Aberta'], em_andamento: ['info', 'circle-dot', 'Em andamento'], concluida: ['success', 'circle-check', 'Concluída'] };

function andamentoCel(id) {
  const a = andamentoOS(id);
  const total = a.total - a.cancelado;
  if (!total) return '<span class="muted">Sem serviços</span>';
  const seg = [['concluido', 'success'], ['em_execucao', 'info'], ['distribuido', 'neutral'], ['na_fila', 'warning']];
  const det = seg.filter(([k]) => a[k]).map(([k]) => `${a[k]} ${ETAPA[k][2].toLowerCase()}`).join(' · ');
  return `<span class="stack" style="min-width:130px" title="${det}"><span class="num">${a.concluido} de ${total} concluído${total === 1 ? '' : 's'}</span>
    <span class="bar" style="height:6px">${seg.map(([k, tom]) => a[k] ? `<span class="d-${tom}" style="width:${(a[k] / total) * 100}%${tom === 'neutral' ? ';opacity:.5' : ''}"></span>` : '').join('')}</span>
    ${a.na_fila ? `<span class="sm tx-warning">${a.na_fila} na fila</span>` : ''}</span>`;
}

/* ───────────────────────── Página: Vendas ───────────────────────── */
function paginaVendas() {
  const veValores = pode('financeiro.ver_valores');
  const eu = S.persona.pessoa;
  const visoes = [['todas', 'Todas'], ['minhas', 'Minhas vendas'], ['na_fila', 'Com serviço na fila'], ['em_execucao', 'Em execução'], ['concluidas', 'Concluídas']];
  const q = (S.vf.q || '').trim().toLowerCase();
  const ids = Object.keys(OS).map(Number).sort((a, b) => b - a).filter((id) => {
    const o = OS[id];
    if (q && !(`${id}`.includes(q) || o.cliente.toLowerCase().includes(q))) return false;
    if (S.vf.visao === 'minhas') return o.vendedor === eu;
    if (S.vf.visao === 'na_fila') return andamentoOS(id).na_fila > 0;
    if (S.vf.visao === 'em_execucao') return statusOS(id) === 'em_andamento';
    if (S.vf.visao === 'concluidas') return statusOS(id) === 'concluida';
    return true;
  }).filter((id) => !veValores || !S.vf.fin || situacaoFin(id) === S.vf.fin);
  return `
    <div class="ph"><div class="t"><h1>Vendas</h1><span class="muted">Cada venda com o andamento da execução nos setores.</span></div>
      ${pode('os.gerenciar') ? `<button class="btn pri" data-ir="vendas-nova">${I('plus')}Nova venda</button>` : ''}</div>
    <div class="toolbar">
      <span class="seg" role="tablist" aria-label="Visões">${visoes.map(([v, t]) => `<button class="${S.vf.visao === v ? 'on' : ''}" data-visao="${v}">${t}</button>`).join('')}</span>
      <span class="sp"></span>
      ${veValores ? `<label class="inline sm muted" for="vf-fin">Financeiro <select class="inp" id="vf-fin" data-vf-fin style="height:32px;width:auto"><option value="">Todas</option>${Object.entries(SIT_FIN).map(([k, v]) => `<option value="${k}" ${S.vf.fin === k ? 'selected' : ''}>${v[2]}</option>`).join('')}</select></label>` : ''}
      <span class="search" style="width:240px;background:hsl(var(--background))">${I('search')}<input id="vf-q" data-vf-q value="${esc(S.vf.q)}" placeholder="Cliente ou número da OS" aria-label="Buscar vendas" style="border:0;outline:0;background:none;flex:1;min-width:0"></span>
    </div>
    ${ids.length ? `<div class="tw"><table>
      <thead><tr><th>OS</th><th>Cliente</th><th>Venda</th><th>Andamento</th><th>Status</th>${veValores ? '<th>Condição</th><th class="r">Valor</th><th>Financeiro</th>' : ''}</tr></thead>
      <tbody>${ids.map((id) => {
        const o = OS[id]; const f = FIN[id];
        return `<tr class="click" data-ir="venda-${id}">
          <td class="num"><b>${id}</b></td>
          <td>${esc(o.cliente)}</td>
          <td><span class="stack"><span class="num">${fmt(dt(o.venda))}</span><span class="sm muted">${esc(PESSOAS[o.vendedor].nome)}</span></span></td>
          <td>${andamentoCel(id)}</td>
          <td>${badge(...STATUS_OS[statusOS(id)])}</td>
          ${veValores ? `<td><span class="stack" style="align-items:flex-start;gap:4px">${badge(...TIPOS[f.tipo])}${condicaoResumo(f) !== TIPOS[f.tipo][2] ? `<span class="sm muted" style="max-width:240px">${esc(condicaoResumo(f))}</span>` : ''}</span></td>
          <td class="r num">${fmtR(f.valor)}${f.mensal ? `<br><span class="sm muted">${fmtR(f.mensal)}/mês</span>` : ''}</td>
          <td>${badge(...SIT_FIN[situacaoFin(id)])}${f.lancado ? `<br><span class="sm muted">${esc(f.lancado.ref)}</span>` : ''}</td>` : ''}
        </tr>`;
      }).join('')}</tbody></table></div>` : empty('search-x', 'Nenhuma venda encontrada', 'Mude a visão ou a busca.')}
    ${veValores ? '' : '<div class="note-wf"><b>Sem permissão de ver valores:</b> condição, valor e situação financeira não aparecem (o backend não envia esses campos). Andamento e quem vendeu continuam visíveis.</div>'}`;
}

/* ───────────────────────── Página: Nova venda / editar ───────────────────────── */
const NV_PADRAO = () => ({
  modo: 'nova', id: null, passo: 1, erros: {}, cliente: '', data: '2026-10-10', prioridade: 'media', obs: '',
  tipo: 'a_vista', valor: '', mensal: '', parcelas: '', intervalo: '30', venc: '', fecha: '', vence: '', forma: 'boleto',
  liberar: 'conclusao', nfNome: '', nfEmail: '', servicos: [{ cat: '', desc: '', prioridade: '' }],
});
function iniciarEdicao(id) {
  const o = OS[id]; const f = FIN[id];
  S.nv = { ...NV_PADRAO(), modo: 'editar', id, cliente: o.cliente, data: dmParaIso(o.venda), prioridade: o.prioridade, obs: o.obs,
    tipo: f.tipo, valor: String(f.valor), mensal: f.mensal ? String(f.mensal) : '', parcelas: String(f.parcelas || f.meses || ''),
    intervalo: f.intervalo ? String(f.intervalo) : '', venc: dmParaIso(f.venc), fecha: f.fecha ? String(f.fecha) : '', vence: f.vence ? String(f.vence) : '',
    forma: f.forma, liberar: f.liberar, nfNome: f.nfNome, nfEmail: f.nfEmail, servicos: [] };
}
const passosNV = () => {
  if (S.nv.modo === 'editar') return pode('financeiro.ver_valores') ? [1, 2] : [1];
  return [1, 2, 3, 4];
};
const NOMES_PASSO = { 1: 'Cliente e venda', 2: 'Condição de pagamento', 3: 'Serviços', 4: 'Revisão' };
const finDoForm = (n) => ({ tipo: n.tipo, parcelas: n.parcelas, intervalo: n.intervalo, meses: n.parcelas, mensal: n.mensal, fecha: n.fecha, vence: n.vence, venc: isoParaDm(n.venc) });

function validarPasso(p) {
  const n = S.nv; const e = {};
  if (p === 1 && !n.cliente) e.cliente = 'Escolha o cliente.';
  if (p === 2) {
    if (!n.valor) e.valor = 'Informe o valor total da venda.';
    if (n.tipo === 'parcelado') {
      if (!n.parcelas || +n.parcelas < 2) e.parcelas = 'O parcelado precisa de pelo menos 2 parcelas.';
      if (!n.venc) e.venc = 'Informe o primeiro vencimento.';
    }
    if (n.tipo === 'recorrente') {
      if (!n.parcelas || +n.parcelas < 1) e.parcelas = 'Informe o número de meses do recorrente.';
      if (!n.vence) e.vence = 'Informe o dia de vencimento do recorrente.';
      if (!n.mensal) e.mensal = 'Informe o valor mensal do recorrente.';
    }
  }
  if (p === 3) {
    if (!n.servicos.some((s) => s.cat)) e.servicos = 'Inclua pelo menos um serviço.';
    n.servicos.forEach((s, i) => { if (s.cat && !s.desc.trim()) e[`desc${i}`] = 'Descreva o serviço (ex.: unidade, escopo).'; });
  }
  n.erros = e;
  return !Object.keys(e).length;
}

const erro = (c) => S.nv.erros[c] ? `<span class="sm tx-danger inline">${I('circle-alert')}${esc(S.nv.erros[c])}</span>` : '';
const campo = (id, rotulo, html, opcional, dica) => `<div class="field"><label for="${id}">${rotulo}${opcional ? ' <span class="muted" style="font-weight:400">(opcional)</span>' : ''}</label>${html}${dica ? `<span class="sm muted">${dica}</span>` : ''}${erro(id.replace('nv-', ''))}</div>`;
const inp = (c, tipo = 'text', extra = '') => `<input class="inp" id="nv-${c}" data-nv="${c}" type="${tipo}" value="${esc(S.nv[c])}" ${extra}>`;

function passo1() {
  const n = S.nv;
  return `<div class="grid2">
    ${campo('nv-cliente', 'Cliente', `<select class="inp" id="nv-cliente" data-nv="cliente"><option value="">Escolha o cliente</option>${CLIENTES.map((c) => `<option ${n.cliente === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`, false, 'Cliente novo: cadastre em Cadastros › Clientes.')}
    ${campo('nv-data', 'Data da venda', inp('data', 'date'))}
  </div>
  <div class="field"><label>Prioridade</label><span class="seg">${Object.entries(PRIOR).map(([k, v]) => `<button type="button" class="${n.prioridade === k ? 'on' : ''}" data-nv-set="prioridade:${k}">${v[2]}</button>`).join('')}</span><span class="sm muted">Vira a prioridade padrão dos serviços.</span></div>
  ${campo('nv-obs', 'Observação', `<textarea class="inp" id="nv-obs" data-nv="obs" placeholder="Ex.: endereço da unidade, contato técnico, restrições de horário">${esc(n.obs)}</textarea>`, true, 'Aparece para quem executa, no detalhe do serviço.')}`;
}

function passo2() {
  const n = S.nv;
  const tipoCard = (k, d) => `<button type="button" class="tipo ${n.tipo === k ? 'on' : ''}" data-nv-set="tipo:${k}" aria-pressed="${n.tipo === k}">${I(TIPOS[k][1])}<b>${TIPOS[k][2]}</b><span class="sm muted">${d}</span></button>`;
  const especificos = {
    a_vista: `<div class="grid2">${campo('nv-venc', 'Vencimento', inp('venc', 'date'), true)}</div>`,
    parcelado: `<div class="grid3">${campo('nv-parcelas', 'Parcelas', inp('parcelas', 'number', 'min="2"'))}${campo('nv-intervalo', 'A cada (dias)', inp('intervalo', 'number', 'min="1"'), true)}${campo('nv-venc', '1º vencimento', inp('venc', 'date'))}</div>`,
    recorrente: `<div class="grid3">${campo('nv-mensal', 'Valor mensal', inp('mensal', 'number', 'step="0.01" min="0"'))}${campo('nv-parcelas', 'Meses', inp('parcelas', 'number', 'min="1"'))}${campo('nv-vence', 'Dia de vencimento', inp('vence', 'number', 'min="1" max="31"'))}</div>
      <div class="grid3">${campo('nv-fecha', 'Dia de fechamento', inp('fecha', 'number', 'min="1" max="31"'), true)}${campo('nv-venc', '1º vencimento', inp('venc', 'date'), true)}</div>`,
  };
  const sugestao = n.tipo === 'recorrente' && n.mensal && n.parcelas ? `${n.parcelas} × ${fmtR(n.mensal)} = ${fmtR(n.mensal * n.parcelas)}. O sistema não calcula um a partir do outro: confira se houve arredondamento negociado.` : 'No recorrente, o valor total é a soma dos meses negociada com o cliente.';
  return `<div class="field"><label>Tipo</label><div class="tipos">${tipoCard('a_vista', 'Um pagamento')}${tipoCard('parcelado', 'Parcelas com intervalo fixo')}${tipoCard('recorrente', 'Mensalidade por N meses')}</div></div>
    <div class="grid2">${campo('nv-valor', 'Valor total', inp('valor', 'number', 'step="0.01" min="0"'), false, n.tipo === 'recorrente' ? sugestao : '')}
      ${campo('nv-forma', 'Forma de pagamento', `<select class="inp" id="nv-forma" data-nv="forma">${Object.entries(FORMAS).map(([k, v]) => `<option value="${k}" ${n.forma === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}</div>
    ${especificos[n.tipo]}
    <div class="field"><label>Quando libera para o financeiro</label><div class="tipos">
      <button type="button" class="tipo ${n.liberar === 'venda' ? 'on' : ''}" data-nv-set="liberar:venda">${I('zap')}<b>Na venda</b><span class="sm muted">O financeiro já pode faturar ao salvar.</span></button>
      <button type="button" class="tipo ${n.liberar === 'conclusao' ? 'on' : ''}" data-nv-set="liberar:conclusao">${I('flag')}<b>Na conclusão</b><span class="sm muted">Quando todos os serviços terminarem.</span></button></div></div>
    <div class="grid2">${campo('nv-nfNome', 'Contato para envio da NF', inp('nfNome'), true)}${campo('nv-nfEmail', 'E-mail da NF', inp('nfEmail', 'email'), true)}</div>
    <div class="preview" id="nv-preview">${I('file-text')}<span><span class="sm muted">Como a condição vai aparecer para o comercial, o financeiro e nos e-mails</span><br><b>${esc(condicaoResumo(finDoForm(n)))}</b></span></div>`;
}

function passo3() {
  const n = S.nv;
  const porSetor = {};
  n.servicos.filter((s) => s.cat).forEach((s) => { const st = CATALOGO.find((c) => c.nome === s.cat).setor; porSetor[st] = (porSetor[st] || 0) + 1; });
  return `<span class="muted">Cada serviço vai para a fila do setor responsável pelo catálogo. Catálogos inativos não aparecem.</span>
    ${n.servicos.map((s, i) => {
      const cat = CATALOGO.find((c) => c.nome === s.cat);
      return `<div class="parte svc-row">
        <div class="field"><label for="nv-s-cat-${i}">Catálogo</label><select class="inp" id="nv-s-cat-${i}" data-nv-s="${i}:cat"><option value="">Escolha</option>${SETORES.map((st) => `<optgroup label="${esc(st.nome)}">${CATALOGO.filter((c) => c.setor === st.id).map((c) => `<option ${s.cat === c.nome ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</optgroup>`).join('')}</select>

        <div class="field"><label for="nv-s-desc-${i}">Descrição</label><input class="inp" id="nv-s-desc-${i}" data-nv-s="${i}:desc" value="${esc(s.desc)}" placeholder="Ex.: unidade fabril e depósito">${erro(`desc${i}`)}</div>
        <div class="field"><label for="nv-s-pri-${i}">Prioridade</label><select class="inp" id="nv-s-pri-${i}" data-nv-s="${i}:prioridade"><option value="">Da venda (${PRIOR[n.prioridade][2]})</option>${Object.entries(PRIOR).map(([k, v]) => `<option value="${k}" ${s.prioridade === k ? 'selected' : ''}>${v[2]}</option>`).join('')}</select></div>
        <button type="button" class="btn ghost sm" data-nv-rm="${i}" aria-label="Remover serviço" ${n.servicos.length === 1 ? 'disabled' : ''}>${I('trash-2')}</button></div>`;
    }).join('')}
    <button type="button" class="btn sm" data-nv-add style="align-self:flex-start">${I('plus')}Mais um serviço</button>
    ${erro('servicos')}
    ${Object.keys(porSetor).length ? `<div class="chips">${Object.entries(porSetor).map(([st, q]) => `<span class="chip">${I('network')}${esc(SETORES.find((x) => x.id === +st).nome)}: ${pl(q, 'serviço', 'serviços')}</span>`).join('')}</div>` : ''}`;
}

function passo4() {
  const n = S.nv;
  const f = finDoForm(n);
  const porSetor = {};
  n.servicos.filter((s) => s.cat).forEach((s) => { const st = CATALOGO.find((c) => c.nome === s.cat).setor; (porSetor[st] ||= []).push(s); });
  const sec = (p, titulo, corpo) => `<section class="card"><div class="card-h"><h2>${titulo}</h2><button class="btn ghost sm" data-nv-ir="${p}">${I('pencil')}Alterar</button></div><div class="card-b">${corpo}</div></section>`;
  return `${sec(1, 'Cliente e venda', `<dl class="kv"><dt>Cliente</dt><dd>${esc(n.cliente)}</dd><dt>Data da venda</dt><dd class="num">${fmt(new Date(n.data + 'T12:00'))}</dd><dt>Prioridade</dt><dd>${bPrior(n.prioridade)}</dd><dt>Observação</dt><dd>${n.obs ? esc(n.obs) : '<span class="muted">—</span>'}</dd></dl>`)}
    ${sec(2, 'Condição de pagamento', `<dl class="kv"><dt>Condição</dt><dd>${badge(...TIPOS[n.tipo])} <b>${esc(condicaoResumo(f))}</b></dd><dt>Valor total</dt><dd class="num">${fmtR(n.valor)}</dd><dt>Forma</dt><dd>${FORMAS[n.forma]}</dd><dt>Libera</dt><dd>${n.liberar === 'venda' ? 'Na venda: o financeiro já pode faturar' : 'Quando todos os serviços terminarem'}</dd><dt>NF para</dt><dd>${n.nfNome || n.nfEmail ? esc([n.nfNome, n.nfEmail].filter(Boolean).join(' · ')) : '<span class="muted">—</span>'}</dd></dl>`)}
    ${sec(3, 'Serviços e avisos', Object.entries(porSetor).map(([st, ss]) => {
      const org = ORGANIZADORES[st];
      return `<div class="outro"><b>${esc(SETORES.find((x) => x.id === +st).nome)}</b>
        <span>${ss.map((s) => `${esc(s.cat)}: ${esc(s.desc)}`).join('<br>')}</span>
        ${org.length ? `<span class="sm muted inline">${I('mail')}E-mail “${pl(ss.length, 'serviço', 'serviços')} para ${esc(SETORES.find((x) => x.id === +st).nome)}” para ${org.map((k) => esc(PESSOAS[k].nome)).join(' e ')}</span>`
          : `<span class="sm tx-warning inline">${I('mail-x')}Setor sem organizador: ninguém recebe o aviso. A diretoria vê os serviços no painel.</span>`}</div>`;
    }).join(''))}`;
}

function paginaNovaVenda() {
  if (!pode('os.gerenciar')) return empty('lock', 'Sem permissão para registrar vendas', 'Peça acesso a quem configura as funções.');
  const n = S.nv;
  const passos = passosNV();
  const idx = passos.indexOf(n.passo);
  const ultimo = idx === passos.length - 1;
  const corpo = { 1: passo1, 2: passo2, 3: passo3, 4: passo4 }[n.passo]();
  return `
    <div class="ph"><div class="t"><h1>${n.modo === 'editar' ? `Editar venda · OS ${n.id}` : 'Nova venda'}</h1>
      <span class="muted">${n.modo === 'editar' ? 'Serviços são acrescentados ou ajustados no resumo da venda.' : 'Os serviços chegam à fila de cada setor quando você registrar a venda.'}</span></div></div>
    <ol class="steps">${passos.map((p, i) => `<li class="${p === n.passo ? 'on' : i < idx ? 'ok' : ''}"><button type="button" ${i < idx ? `data-nv-ir="${p}"` : 'disabled'}><span class="n">${i < idx ? I('check') : i + 1}</span>${NOMES_PASSO[p]}</button></li>`).join('')}</ol>
    <div class="card" style="max-width:860px"><div class="card-b form">${corpo}</div>
      <div class="modal-f" style="justify-content:space-between">
        <button class="btn" ${idx === 0 ? `data-ir="${n.modo === 'editar' ? `venda-${n.id}` : 'vendas'}"` : `data-nv-ir="${passos[idx - 1]}"`}>${idx === 0 ? 'Cancelar' : `${I('arrow-left')}Voltar`}</button>
        <button class="btn pri" ${ultimo ? 'data-nv-salvar' : 'data-nv-prox'}>${ultimo ? `${I('check')}${n.modo === 'editar' ? 'Salvar alterações' : 'Registrar venda'}` : `Continuar${I('arrow-right')}`}</button>
      </div></div>
    ${S.nv.modo === 'nova' && !pode('financeiro.ver_valores') ? '<div class="note-wf"><b>Administrativo:</b> informa a condição ao criar a venda, mas depois não a vê (decisão do ADR 0008, 8). Na edição, a etapa de condição não aparece.</div>' : ''}`;
}

function salvarVenda() {
  const n = S.nv;
  const f = { valor: +n.valor, tipo: n.tipo, forma: n.forma, liberar: n.liberar, nfNome: n.nfNome, nfEmail: n.nfEmail, venc: isoParaDm(n.venc) || undefined };
  if (n.tipo === 'parcelado') Object.assign(f, { parcelas: +n.parcelas, intervalo: n.intervalo ? +n.intervalo : undefined });
  if (n.tipo === 'recorrente') Object.assign(f, { meses: +n.parcelas, mensal: +n.mensal, vence: +n.vence, fecha: n.fecha ? +n.fecha : undefined });
  if (n.modo === 'editar') {
    Object.assign(OS[n.id], { cliente: n.cliente, venda: isoParaDm(n.data), prioridade: n.prioridade, obs: n.obs });
    if (pode('financeiro.ver_valores')) FIN[n.id] = { ...FIN[n.id], ...f };
    toast('Venda atualizada.');
    return ir(`venda-${n.id}`);
  }
  const id = Math.max(...Object.keys(OS).map(Number)) + 1;
  OS[id] = { cliente: n.cliente, venda: isoParaDm(n.data), vendedor: S.persona.pessoa, prioridade: n.prioridade, obs: n.obs };
  FIN[id] = f;
  n.servicos.filter((s) => s.cat).forEach((s, i) => {
    SERVICOS.push({ id: 600 + id * 10 + i, setor: CATALOGO.find((c) => c.nome === s.cat).setor, os: id, cat: s.cat, desc: s.desc, chegou: '10/10', tarefas: [] });
  });
  const setores = [...new Set(n.servicos.filter((s) => s.cat).map((s) => CATALOGO.find((c) => c.nome === s.cat).setor))];
  toast(`Venda OS ${id} registrada. ${pl(setores.length, 'setor avisado', 'setores avisados')} por e-mail.`);
  ir(`venda-${id}`);
}

/* ───────────────────────── Página: Resumo da venda ───────────────────────── */
function eventosDaVenda(id) {
  const o = OS[id]; const f = FIN[id];
  const veValores = pode('financeiro.ver_valores');
  const ev = [[dt(o.venda), PESSOAS[o.vendedor].nome, 'shopping-cart', 'info', `Venda registrada${veValores ? `: ${condicaoResumo(f)}` : ''}`]];
  servicosDaOS(id).forEach((s) => eventosDoServico(s).filter((e) => e[2] !== 'shopping-cart').forEach((e) => ev.push(e)));
  const lib = liberacao(id);
  if (statusOS(id) === 'concluida') ev.push([lib.em || termino(servicosDaOS(id)[0]), null, 'circle-check', 'success', 'OS concluída: todos os serviços terminaram']);
  if (lib.liberada) ev.push([lib.em, lib.motivo === 'na venda' ? PESSOAS[o.vendedor].nome : null, 'unlock', 'warning', `Liberada para faturar (${lib.motivo})`]);
  if (f.lancado) ev.push([dt(f.lancado.data), PESSOAS[f.lancado.por].nome, 'receipt', 'success', `Faturada${veValores ? ` (ref. ${f.lancado.ref})` : ''}`]);
  return ev.sort((a, b) => b[0] - a[0]);
}

              <td>${etapa(s) === 'na_fila' ? '<span class="muted">—</span>' : prazoCel(prazoServico(s), etapa(s) === 'concluido')}</td>

          <dt>Lançamento</dt><dd>${f.lancado ? `<span class="stack"><span>${esc(f.lancado.ref)}</span><span class="sm muted">${fmt(dt(f.lancado.data))} · ${esc(PESSOAS[f.lancado.por].nome)}</span></span>` : '<span class="muted">Não lançada</span>'}</dd>
