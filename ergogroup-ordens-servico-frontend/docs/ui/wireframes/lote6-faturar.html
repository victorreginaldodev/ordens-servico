<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faturar com todos os dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens propostos em docs/ui/design-system.md §2 */
:root{
  --background:0 0% 100%;--foreground:222 47% 11%;--card:0 0% 100%;
  --muted:210 40% 96%;--muted-foreground:215 20% 42%;--border:214 32% 91%;
  --accent:210 40% 96%;--primary:173 58% 31%;--primary-foreground:0 0% 100%;
  --sidebar:210 40% 98%;
  --success-subtle:138 76% 96%;--success-strong:142 72% 26%;
  --warning-subtle:48 96% 94%;--warning-strong:26 90% 33%;
  --danger-subtle:0 86% 96%;--danger-strong:0 70% 40%;
  --info-subtle:214 95% 96%;--info-strong:224 70% 42%;
}
[data-theme="dark"]{
  --background:222 47% 6%;--foreground:210 40% 98%;--card:222 47% 8%;
  --muted:222 30% 18%;--muted-foreground:215 20% 62%;--border:222 30% 18%;
  --accent:222 30% 14%;--primary:173 55% 45%;--primary-foreground:222 47% 6%;
  --sidebar:222 47% 7%;
  --success-subtle:172 50% 11%;--success-strong:142 69% 62%;
  --warning-subtle:35 26% 14%;--warning-strong:43 96% 62%;
  --danger-subtle:329 35% 12%;--danger-strong:0 91% 72%;
  --info-subtle:219 55% 16%;--info-strong:213 94% 72%;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
svg.lucide{width:16px;height:16px;flex-shrink:0;stroke-width:2}
.muted{color:hsl(var(--muted-foreground))}
.num{font-variant-numeric:tabular-nums}

/* Barra do wireframe (fora do produto) */
.wf{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 16px;background:repeating-linear-gradient(45deg,hsl(var(--muted)),hsl(var(--muted)) 6px,hsl(var(--background)) 6px,hsl(var(--background)) 12px);border-bottom:1px dashed hsl(var(--muted-foreground)/.5);font-size:12px}
.wf b{font-weight:600}
.seg{display:inline-flex;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--card));padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))}
.seg button.on{background:hsl(var(--foreground));color:hsl(var(--background))}

/* Shell */
.app{display:flex;min-height:calc(100vh - 41px)}
.sb{width:240px;flex-shrink:0;background:hsl(var(--sidebar));border-right:1px solid hsl(var(--border));display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 41px);transition:width .2s}
.sb.col{width:64px}
.sb-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid hsl(var(--border))}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.logo-mark{width:28px;height:28px;border-radius:8px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;font-size:13px;flex-shrink:0}
.logo span.g{color:hsl(var(--primary))}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;border-radius:8px;cursor:pointer;color:hsl(var(--muted-foreground))}
.icon-btn:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.nav{flex:1;overflow-y:auto;padding:8px}
.grp{font-size:11px;line-height:16px;font-weight:600;color:hsl(var(--muted-foreground));padding:16px 8px 6px;white-space:nowrap}
.sb.col .grp{visibility:hidden;padding:8px 0 4px;height:12px}
.it{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:hsl(var(--muted-foreground));font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-decoration:none}
.it:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.it.on{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:0 0 0 1px hsl(var(--border)),0 1px 2px hsl(0 0% 0%/.04)}
.it.on svg{color:hsl(var(--primary))}
.sb.col .it{justify-content:center;padding:0}
.sb.col .it span,.sb.col .logo span,.sb.col .who{display:none}
.sb.col .sb-top{justify-content:center;padding:0}
.sb.col .sb-top .logo{display:none}
.sb-foot{border-top:1px solid hsl(var(--border));padding:8px}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}
.me:hover{background:hsl(var(--accent))}
.av{width:32px;height:32px;border-radius:50%;background:hsl(var(--primary)/.15);color:hsl(var(--primary));display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.who{min-width:0;flex:1;line-height:18px}
.who .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .r{font-size:12px;color:hsl(var(--muted-foreground))}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background));position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:6px;color:hsl(var(--muted-foreground));white-space:nowrap}
.crumb b{color:hsl(var(--foreground));font-weight:600}
.crumb svg{width:14px;height:14px;opacity:.6}
.gsearch{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:36px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:10px;color:hsl(var(--muted-foreground));background:hsl(var(--muted)/.4);cursor:text}
.kbd{margin-left:auto;font-size:11px;border:1px solid hsl(var(--border));border-radius:4px;padding:0 5px;background:hsl(var(--card))}
.content{padding:24px 32px 40px}

/* PageHeader */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.ph h1{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.count{font-size:12px;font-weight:600;line-height:16px;padding:2px 8px;border-radius:999px;background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.ph p{color:hsl(var(--muted-foreground));margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--card));font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:hsl(var(--accent))}
.btn.pri{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent;box-shadow:0 1px 2px hsl(0 0% 0%/.08)}
.btn.pri:hover{background:hsl(var(--primary)/.9)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.dash{border-style:dashed;color:hsl(var(--muted-foreground))}
.btn.dash.act{border-style:solid;color:hsl(var(--foreground))}

/* Tabs + visões */
.tabs{display:flex;gap:4px;border-bottom:1px solid hsl(var(--border));margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:hsl(var(--foreground));border-color:hsl(var(--primary))}
.views{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.views button{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:0;background:none;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer}
.views button:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.views button.on{background:hsl(var(--muted));color:hsl(var(--foreground))}
.views .c{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.views button.alert .c{color:hsl(var(--danger-strong));opacity:1;font-weight:600}

/* Moldura da tabela */
.frame{border:1px solid hsl(var(--border));border-radius:12px;background:hsl(var(--card));overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid hsl(var(--border));flex-wrap:wrap}
.tsearch{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:8px;width:320px;max-width:100%}
.tsearch input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px}
.tsearch:focus-within{box-shadow:0 0 0 2px hsl(var(--primary)/.35);border-color:hsl(var(--primary))}
.tb .sp{flex:1}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted)/.25);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;border-radius:6px;background:hsl(var(--card));border:1px solid hsl(var(--border));font-weight:500}
.chip button{border:0;background:none;cursor:pointer;display:grid;place-items:center;color:hsl(var(--muted-foreground));border-radius:4px}
.chip svg{width:12px;height:12px}
.link{border:0;background:none;color:hsl(var(--primary));font-weight:500;cursor:pointer;font-size:12px}
.pop{position:absolute;z-index:50;min-width:220px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:10px;box-shadow:0 8px 24px hsl(0 0% 0%/.12);padding:4px}
.pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.pop label:hover{background:hsl(var(--accent))}
.pop label .c{margin-left:auto;font-size:12px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums}
.pop .h{font-size:11px;font-weight:600;color:hsl(var(--muted-foreground));padding:6px 8px 2px}
.pop input{accent-color:hsl(var(--primary))}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:56px;z-index:5;background:hsl(var(--muted)/.4);backdrop-filter:blur(6px);height:40px;padding:0 12px;text-align:left;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border));white-space:nowrap}
[data-theme="dark"] thead th{background:hsl(222 40% 10%)}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:hsl(var(--foreground))}
thead th .h{display:inline-flex;align-items:center;gap:4px}
thead th svg{width:14px;height:14px;opacity:.5}
thead th.sorted{color:hsl(var(--foreground))}
thead th.sorted svg{opacity:1}
th.r,td.r{text-align:right}
th.r .h{flex-direction:row-reverse}
tbody tr{border-bottom:1px solid hsl(var(--border));cursor:pointer;outline:none}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:hsl(var(--muted)/.5)}
tbody tr:focus-visible{box-shadow:inset 0 0 0 2px hsl(var(--primary))}
tbody tr.inactive{opacity:.65}
td{padding:10px 12px;vertical-align:middle;white-space:nowrap}
.dense td{padding-top:6px;padding-bottom:6px}
.reg .t{font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.reg .s{font-size:12px;line-height:16px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.dense .reg{display:flex;align-items:baseline;gap:10px}
.dense .reg .t{max-width:280px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:12px;font-weight:500}
.badge svg{width:14px;height:14px}
.b-warning{background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong))}
.b-info{background:hsl(var(--info-subtle));color:hsl(var(--info-strong))}
.b-success{background:hsl(var(--success-subtle));color:hsl(var(--success-strong))}
.b-danger{background:hsl(var(--danger-subtle));color:hsl(var(--danger-strong))}
.b-neutral{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.prio{display:inline-flex;align-items:center;gap:4px}
.prio.alta{color:hsl(var(--danger-strong));font-weight:500}
.prio.media{color:hsl(var(--warning-strong))}
.prio.baixa{color:hsl(var(--muted-foreground))}
.prazo .s{font-size:12px;line-height:16px;display:flex;align-items:center;gap:4px}
.prazo .s svg{width:12px;height:12px}
.dense .prazo{display:flex;gap:8px;align-items:baseline}
.late{color:hsl(var(--danger-strong));font-weight:500}
.soon{color:hsl(var(--warning-strong))}
.pessoa{display:inline-flex;align-items:center;gap:8px}
.pessoa i{width:20px;height:20px;border-radius:50%;font-style:normal;font-size:10px;font-weight:600;display:grid;place-items:center;background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.bool{display:inline-flex;align-items:center;gap:4px}
.bool svg{width:14px;height:14px;color:hsl(var(--primary))}
.nivel{display:inline-flex;align-items:center;gap:8px}
.nivel .bars{display:inline-flex;gap:2px}
.nivel .bars b{width:4px;height:12px;border-radius:1px;background:hsl(var(--border))}
.nivel .bars b.f{background:hsl(var(--foreground)/.7)}
.money{font-weight:500;font-variant-numeric:tabular-nums}
.act{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:hsl(var(--muted-foreground));opacity:.5;cursor:pointer}
tr:hover .act,tr:focus-within .act{opacity:1}
.act:hover{background:hsl(var(--accent))}
.dash-v{color:hsl(var(--muted-foreground))}

.ft{display:flex;align-items:center;gap:16px;padding:10px 12px;border-top:1px solid hsl(var(--border));font-size:12px;color:hsl(var(--muted-foreground));flex-wrap:wrap}
.ft .sp{flex:1}
.ft select{height:28px;border:1px solid hsl(var(--border));border-radius:6px;background:hsl(var(--card));padding:0 6px;font-size:12px}
.pg{display:flex;gap:2px;align-items:center}
.pg button{min-width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;color:hsl(var(--foreground));display:grid;place-items:center}
.pg button:hover:not(:disabled){background:hsl(var(--accent))}
.pg button.on{background:hsl(var(--foreground));color:hsl(var(--background));font-weight:600}
.pg button:disabled{opacity:.35;cursor:default}
.total{color:hsl(var(--foreground));font-weight:600}
.empty{padding:56px 16px;text-align:center}
.empty svg{width:32px;height:32px;color:hsl(var(--muted-foreground));margin-bottom:12px}
.empty h3{font-size:16px;font-weight:600;margin-bottom:4px}
.empty p{color:hsl(var(--muted-foreground));margin-bottom:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:hsl(var(--foreground));color:hsl(var(--background));padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:1279px){.p2{display:none}}
/* ---- Lote 5 (financeiro) ---- */
.tabs .c{font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));margin-left:6px;font-variant-numeric:tabular-nums}
.tabs .v{display:block;font-size:11px;font-weight:500;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums;text-align:left}
.tabs button{text-align:left;line-height:18px}
.tabs .arrow{align-self:center;color:hsl(var(--muted-foreground));opacity:.5;padding:0 2px}
.conf{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:16px;border:1px solid}
.conf.warn{background:hsl(var(--warning-subtle));color:hsl(var(--warning-strong));border-color:hsl(var(--warning-strong)/.25)}
.conf.ok{background:hsl(var(--success-subtle));color:hsl(var(--success-strong));border-color:hsl(var(--success-strong)/.25)}
.conf .t{flex:1;min-width:0}
.conf .t b{font-weight:600}
.conf .t span{opacity:.85}
.mes{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500}
.mes button{width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.mes button:hover{background:hsl(var(--accent))}
.amarelo{color:hsl(var(--warning-strong));font-weight:500}
.vermelho{color:hsl(var(--danger-strong));font-weight:500}
.btn.out{height:30px;padding:0 10px;font-size:13px}
.btn.out svg{width:14px;height:14px}
.acts{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.pend{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:500;background:hsl(var(--muted));color:hsl(var(--muted-foreground));margin-left:4px}
.svc{font-weight:500;text-transform:uppercase;font-size:13px}
.svc-s{font-size:12px;color:hsl(var(--muted-foreground))}
.note{font-size:12px;color:hsl(var(--muted-foreground));border:1px dashed hsl(var(--border));border-radius:8px;padding:8px 10px;margin-top:12px}
.note b{color:hsl(var(--foreground))}
/* Resumo */
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid hsl(var(--border));border-radius:12px;background:hsl(var(--card));padding:16px}
.card thead th{position:static}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.faixa{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-bottom:16px}
.faixa svg{width:20px;height:20px;margin-top:1px}
.faixa b{font-weight:600}
.faixa .sub{display:block;font-size:13px;opacity:.9;margin-top:2px}
.dl{display:grid;grid-template-columns:150px 1fr auto;gap:8px 12px;font-size:14px;align-items:center}
.dl dt{color:hsl(var(--muted-foreground))}
.copy{width:26px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:hsl(var(--muted-foreground))}
.copy:hover{background:hsl(var(--accent));color:hsl(var(--foreground))}
.copy svg{width:14px;height:14px}
.destaque{background:hsl(var(--muted));border-radius:8px;padding:10px 12px;margin-bottom:14px}
.destaque .l{font-size:12px;color:hsl(var(--muted-foreground))}
.destaque .v{font-weight:600}
.obs{border:1px solid hsl(var(--warning-strong)/.3);background:hsl(var(--warning-subtle)/.6);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px}
.obs .l{font-size:12px;font-weight:600;color:hsl(var(--warning-strong));margin-bottom:2px}
.tl{list-style:none;padding:0;display:grid;gap:12px}
.tl li{display:flex;gap:10px;font-size:13px}
.tl .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.tl .ic svg{width:14px;height:14px}
.tl .q{font-size:12px;color:hsl(var(--muted-foreground))}
.seg.sm button{font-size:11px;padding:2px 8px}
tr.cancel td{opacity:.55;text-decoration:line-through}
tr.cancel td:last-child{text-decoration:none}
/* Conferência */
.chk{border:1px solid hsl(var(--border));border-radius:12px;background:hsl(var(--card));margin-bottom:10px;overflow:hidden}
.chk-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.chk-h:hover{background:hsl(var(--muted)/.4)}
.chk-i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chk-t{flex:1;min-width:0}
.chk-t b{font-weight:600;display:block}
.chk-t span{font-size:12px;color:hsl(var(--muted-foreground))}
.chk-n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.chk-b{border-top:1px solid hsl(var(--border))}
.secao{font-size:12px;font-weight:600;color:hsl(var(--muted-foreground));margin:20px 0 8px;text-transform:uppercase;letter-spacing:.04em}
/* Modal */
.ov{position:fixed;inset:0;background:hsl(222 47% 11%/.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{width:520px;max-width:100%;background:hsl(var(--card));border-radius:14px;box-shadow:0 20px 50px hsl(0 0% 0%/.25);overflow:hidden}
.mh{padding:16px 20px 8px}
.mh h3{font-size:16px;font-weight:600}
.steps{display:flex;gap:8px;font-size:12px;color:hsl(var(--muted-foreground));margin-top:6px}
.steps .on{color:hsl(var(--primary));font-weight:600}
.mb{padding:8px 20px 16px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid hsl(var(--border));background:hsl(var(--muted)/.3)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500}
.field input{height:36px;border:1px solid hsl(var(--border));border-radius:8px;padding:0 10px;background:hsl(var(--card))}
.field .h{font-size:12px;color:hsl(var(--muted-foreground))}
/* ---- Lote 6: Faturar com todos os dados ---- */
.modal.xl{width:1040px}
.modal .mb{max-height:calc(100vh - 220px);overflow-y:auto;padding:12px 20px 20px}
.sec{margin-top:18px}
.sec:first-child{margin-top:4px}
.sec h4{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.sec h4 svg{color:hsl(var(--muted-foreground))}
.sec h4 .sp{flex:1}
.grid-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
@media (max-width:820px){.grid-dados{grid-template-columns:1fr}}
.dado{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed hsl(var(--border));font-size:13px;min-width:0}
.dado dt{color:hsl(var(--muted-foreground))}
.dado dd{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dado dd.forte{font-weight:600}
/* tabela no visual atual do app (Resumo da venda): cabeçalho bg-secondary, caixa alta, linhas verticais */
.tbl{border:1px solid hsl(var(--border));border-radius:8px;overflow:auto}
.tbl table{min-width:820px}
.tbl thead th{position:static;background:hsl(var(--muted));height:38px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground));padding:0 10px;backdrop-filter:none}
.tbl thead th+th,.tbl tbody td+td{border-left:1px solid hsl(var(--border)/.8)}
.tbl tbody tr{cursor:default}
.tbl tbody td{padding:8px 10px;vertical-align:top;white-space:normal;font-size:13px}
.pess{display:block;white-space:nowrap}
.pess+.pess{margin-top:2px}
.pess small{color:hsl(var(--muted-foreground));font-size:11px;margin-left:4px}
.resumo-fixo{display:flex;flex-wrap:wrap;gap:6px 18px;background:hsl(var(--muted));border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.resumo-fixo b{font-weight:600}
.etq{font-size:11px;color:hsl(var(--muted-foreground));display:block}
.lista-fundo{opacity:.55;pointer-events:none}
</style>
</head>
<body>

<div class="wf">
  <b>Wireframe · APROVADO (lote 6)</b>
  <span>Etapa <span class="seg" id="wf-step"></span></span>
  <span>Venda <span class="seg" id="wf-os"></span></span>
  <span>Tema <span class="seg" id="wf-theme"></span></span>
  <span class="muted">Faturar com todos os dados · dados fictícios · doc: backend/docs/faturamento/04-proposta-ux-financeiro.md §9</span>
</div>

<div class="app">
  <aside class="sb" id="sb"></aside>
  <div class="main">
    <header class="hd"><div class="crumb"><span>Financeiro</span><i data-lucide="chevron-right"></i><b>Cobranças</b></div></header>
    <main class="content lista-fundo" id="page"></main>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const I = (n) => `<i data-lucide="${n}"></i>`;
const brl = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = (s) => String(s ?? '').replace(/"/g, '&quot;');

/* ---------- vendas de exemplo ---------- */
const VENDAS = {
  conclusao: {
    os: 1298, situacao: 'Para faturar', liberacao: 'conclusao',
    liberadaEm: '08/10/2026', liberadaPor: 'Rafael Lima Andrade', aguardando: 6,
    cliente: {
      nome: 'Hospital São Lucas Ltda', inscricao: 'CNPJ', numero: '12.345.678/0001-90', tipo: 'Gestão',
      representante: 'Rosana Medeiros Couto', setorRep: 'Recursos Humanos', email: 'rosana.medeiros@saolucas.com.br', telefone: '(41) 99876-5432',
      obs: 'Cliente de gestão desde 2021. Cobra revisões e alterações.', ativo: true,
    },
    venda: { data: '02/09/2026', vendedor: 'Ana Martins Rocha' },
    cond: {
      valor: 9500, tipo: 'Parcelado', resumo: 'Parcelado em 6x de R$ 1.583,33 (mensais), 1ª parcela 10/11/2026, demais todo dia 10',
      parcelas: '6 × R$ 1.583,33 (mensais)', venc: '10/11/2026', demais: 'Todo dia 10', forma: 'Boleto',
      nfNome: 'Rosana Medeiros Couto', nfEmail: 'financeiro@saolucas.com.br',
      obs: 'Colocar o número do pedido de compra 88231 no corpo da NF.',
    },
    servicos: [
      { nome: 'PCMSO', desc: 'Programa anual com exames por função', setor: 'Saúde Ocupacional', exec: [['Mariana Souza Lima', '05/09', '30/09'], ['Rafael Lima Andrade', '12/09', '08/10']], inicio: '05/09/2026', termino: '08/10/2026', final: 'Rafael Lima Andrade', etapa: 'Concluído' },
      { nome: 'LAUDO DE RUÍDO', desc: 'Dosimetria em 3 setores', setor: 'Higiene Ocupacional', exec: [['Patrícia Nogueira Alves', '10/09', '02/10']], inicio: '10/09/2026', termino: '02/10/2026', final: 'Patrícia Nogueira Alves', etapa: 'Concluído' },
      { nome: 'TREINAMENTO NR-35', desc: 'Turma de 20 pessoas', setor: 'Treinamentos', exec: [], inicio: null, termino: null, final: null, etapa: 'Cancelado' },
    ],
    avisos: [],
  },
  venda: {
    os: 1312, situacao: 'Para faturar', liberacao: 'venda',
    liberadaEm: '10/10/2026', liberadaPor: 'Ana Martins Rocha', aguardando: 4,
    cliente: {
      nome: 'Metalúrgica Paraná Ltda', inscricao: 'CNPJ', numero: '98.765.432/0001-10', tipo: 'Avulso',
      representante: 'Carlos Eduardo Pires', setorRep: 'Segurança do Trabalho', email: 'carlos.pires@metalpr.com.br', telefone: '(41) 3333-2211',
      obs: null, ativo: true,
    },
    venda: { data: '10/10/2026', vendedor: 'Ana Martins Rocha' },
    cond: {
      valor: 4800, tipo: 'À vista', resumo: 'À vista, vence 21 dias após a nota',
      parcelas: null, venc: '21 dias após a nota', demais: null, forma: 'PIX',
      nfNome: 'Carlos Eduardo Pires', nfEmail: 'nf@metalpr.com.br', obs: null,
    },
    servicos: [
      { nome: 'PGR', desc: 'Levantamento de riscos e plano de ação', setor: 'Segurança do Trabalho', exec: [['Carlos Paiva Mendes', '12/10', '14/10']], inicio: '12/10/2026', termino: '14/10/2026', final: 'Carlos Paiva Mendes', etapa: 'Concluído' },
      { nome: 'AET', desc: 'Análise ergonômica dos postos da produção', setor: 'Ergonomia', exec: [['Larissa Andrade Costa', '13/10', null]], inicio: '13/10/2026', termino: null, final: null, etapa: 'Em andamento' },
      { nome: 'LTCAT', desc: 'Laudo de condições ambientais', setor: 'Segurança do Trabalho', exec: [], inicio: null, termino: null, final: null, etapa: 'A distribuir' },
    ],
    avisos: [['Mudou depois da liberação', 'Valor alterado de R$ 4.200,00 para R$ 4.800,00 por Ana Martins Rocha em 12/10/2026.']],
  },
};
const S = { step: 1, venda: 'conclusao', theme: 'light' };

/* ---------- barra do wireframe ---------- */
function seg(id, opts, key) {
  const el = document.getElementById(id);
  el.innerHTML = opts.map(([v, l]) => `<button class="${S[key] === v ? 'on' : ''}" data-v="${v}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => (b.onclick = () => { S[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; if (key === 'theme') document.documentElement.dataset.theme = S.theme; render(); }));
}

/* ---------- fundo: a lista de Cobranças ---------- */
function fundo() {
  document.getElementById('sb').innerHTML = `<div class="sb-top"><div class="logo"><div class="logo-mark">E</div><span>ERGO<span class="g">GROUP</span></span></div></div>
    <nav class="nav"><div class="grp">Financeiro</div><a class="it on">${I('receipt')}<span>Cobranças</span></a></nav>`;
  document.getElementById('page').innerHTML = `<div class="ph"><div><h1>Cobranças</h1><p>O que já pode ser faturado, o que ainda está em execução e o que já foi lançado.</p></div></div>
    <div class="frame"><table><thead><tr><th>OS</th><th>Cliente</th><th class="r">Valor</th><th>Condição</th><th>Liberação</th><th>Aguardando</th><th class="r">Ações</th></tr></thead>
    <tbody>${Object.values(VENDAS).map((v) => `<tr><td><b>${v.os}</b></td><td>${v.cliente.nome}</td><td class="r money">${brl(v.cond.valor)}</td><td><span class="badge b-info">${v.cond.tipo}</span></td><td>${v.liberacao === 'venda' ? 'Na venda' : 'Serviços concluídos'}</td><td>${v.aguardando} dias</td><td class="r">${I('receipt')}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- o modal ---------- */
const copia = (v) => `<button class="copy" title="Copiar" data-copy="${esc(v)}">${I('copy')}</button>`;
const dado = (rotulo, valor, { copiar = false, forte = false } = {}) =>
  `<div class="dado"><dt>${rotulo}</dt><dd class="${forte ? 'forte' : ''}" title="${esc(valor ?? '')}">${valor ?? '<span class="muted">Não informado</span>'}</dd><dd>${copiar && valor ? copia(valor) : ''}</dd></div>`;

function etapa1(v) {
  const ativos = v.servicos.filter((s) => s.etapa !== 'Cancelado');
  const concl = ativos.filter((s) => s.etapa === 'Concluído').length;
  const faixa = v.liberacao === 'venda'
    ? `<div class="faixa b-warning">${I('zap')}<div><b>Liberação na venda:</b> liberada em ${v.liberadaEm} por ${v.liberadaPor}. Pode faturar antes de os serviços terminarem.<span class="sub">Andamento: ${concl} de ${ativos.length} serviços concluídos.</span></div></div>`
    : `<div class="faixa b-success">${I('check-check')}<div><b>Liberada em ${v.liberadaEm},</b> quando o último serviço foi concluído (por ${v.liberadaPor}).<span class="sub">Todos os ${ativos.length} serviços concluídos · aguardando o lançamento há ${v.aguardando} dias.</span></div></div>`;
  const avisos = v.avisos.map(([t, d]) => `<div class="faixa b-danger">${I('alert-triangle')}<div><b>${t}:</b> ${d}</div></div>`).join('');
  const c = v.cliente, k = v.cond;
  return `
    ${faixa}${avisos}
    <section class="sec"><h4>${I('building-2')}Cliente</h4>
      <dl class="grid-dados">
        ${dado('Razão social', c.nome, { copiar: true, forte: true })}
        ${dado(c.inscricao, c.numero, { copiar: true })}
        ${dado('Tipo de cliente', c.tipo)}
        ${dado('Representante', c.representante, { copiar: true })}
        ${dado('Setor do representante', c.setorRep)}
        ${dado('E-mail', c.email, { copiar: true })}
        ${dado('Telefone', c.telefone, { copiar: true })}
        ${dado('Situação', c.ativo ? 'Ativo' : 'Inativo')}
      </dl>
      ${c.obs ? `<p class="note" style="margin-top:8px"><b>Observação do cliente:</b> ${c.obs}</p>` : ''}
    </section>
    <section class="sec"><h4>${I('handshake')}Venda</h4>
      <dl class="grid-dados">
        ${dado('OS', String(v.os), { copiar: true, forte: true })}
        ${dado('Data da venda', v.venda.data)}
        ${dado('Vendido por', v.venda.vendedor)}
        ${dado('Liberada em', `${v.liberadaEm} · ${v.liberacao === 'venda' ? 'na venda' : 'serviços concluídos'}`)}
      </dl>
    </section>
    <section class="sec"><h4>${I('file-text')}Condição de pagamento<span class="sp"></span><button class="btn sm" data-todo>${I('clipboard-copy')}Copiar tudo</button></h4>
      <div class="destaque"><div class="l">Condição combinada</div><div class="v">${k.resumo}</div></div>
      <dl class="grid-dados">
        ${dado('Valor total', brl(k.valor), { copiar: true, forte: true })}
        ${dado('Tipo', k.tipo)}
        ${k.parcelas ? dado('Parcelas', k.parcelas, { copiar: true }) : ''}
        ${dado(k.parcelas ? 'Vencimento da 1ª' : 'Vencimento', k.venc, { copiar: true })}
        ${k.demais ? dado('Demais parcelas', k.demais) : ''}
        ${dado('Forma', k.forma)}
        ${dado('Enviar NF para', k.nfNome, { copiar: true })}
        ${dado('E-mail da NF', k.nfEmail, { copiar: true })}
      </dl>
      ${k.obs ? `<div class="obs"><div class="l">Observações de pagamento e faturamento</div>${k.obs}</div>` : ''}
    </section>
    <section class="sec"><h4>${I('list-checks')}Serviços realizados<span class="sp"></span><span class="muted" style="font-weight:500">${concl} de ${ativos.length} concluídos</span></h4>
      <div class="tbl"><table>
        <thead><tr><th>Serviço</th><th>Setor</th><th>Executado por</th><th>Início</th><th>Término</th><th>Finalizado por</th><th>Etapa</th></tr></thead>
        <tbody>${v.servicos.map((s) => `<tr${s.etapa === 'Cancelado' ? ' class="cancel"' : ''}>
          <td><div class="svc">${s.nome}</div><div class="svc-s">${s.desc}</div></td>
          <td>${s.setor}</td>
          <td>${s.exec.length ? s.exec.map(([n, i, t]) => `<span class="pess">${n}<small>${i}${t ? ` → ${t}` : ' → em andamento'}</small></span>`).join('') : `<span class="${s.etapa === 'Cancelado' ? 'muted' : 'amarelo'}">${s.etapa === 'Cancelado' ? '—' : 'Sem distribuir'}</span>`}</td>
          <td class="num">${s.inicio ?? '—'}</td><td class="num">${s.termino ?? '—'}</td>
          <td>${s.final ?? '<span class="muted">—</span>'}</td>
          <td><span class="badge ${s.etapa === 'Concluído' ? 'b-success' : s.etapa === 'Cancelado' ? 'b-neutral' : s.etapa === 'Em andamento' ? 'b-info' : 'b-warning'}">${s.etapa}</span></td></tr>`).join('')}</tbody>
      </table></div>
    </section>`;
}

function etapa2(v) {
  return `
    <div class="resumo-fixo">
      <span><span class="etq">Cliente</span><b>${v.cliente.nome}</b></span>
      <span><span class="etq">${v.cliente.inscricao}</span><b>${v.cliente.numero}</b></span>
      <span><span class="etq">Valor</span><b>${brl(v.cond.valor)}</b></span>
      <span><span class="etq">Condição</span><b>${v.cond.resumo}</b></span>
    </div>
    <div class="field"><label>Número da nota fiscal ou referência do lançamento</label><input placeholder="Ex.: NF 4567"><span class="h">O número gerado no sistema financeiro. Opcional.</span></div>
    <div class="field"><label>Data do lançamento</label><input value="14/10/2026" style="width:180px"></div>`;
}

function renderModal() {
  const v = VENDAS[S.venda];
  document.getElementById('modal').innerHTML = `<div class="ov"><div class="modal xl" role="dialog" aria-modal="true">
    <div class="mh"><h3>Faturar a OS ${v.os} · ${v.cliente.nome}</h3>
      <div class="steps"><span class="${S.step === 1 ? 'on' : ''}">1. Conferir todos os dados</span><span>›</span><span class="${S.step === 2 ? 'on' : ''}">2. Registrar o lançamento</span></div></div>
    <div class="mb">${S.step === 1 ? etapa1(v) : etapa2(v)}</div>
    <div class="mf">${S.step === 1
      ? `<button class="btn" data-x>Cancelar</button><button class="btn pri" data-next>Está tudo certo, continuar</button>`
      : `<button class="btn" data-prev>${I('arrow-left')}Voltar</button><button class="btn pri" data-ok>${I('receipt')}Registrar lançamento</button>`}</div>
  </div></div>`;
  const el = document.getElementById('modal');
  el.querySelector('[data-next]')?.addEventListener('click', () => { S.step = 2; render(); });
  el.querySelector('[data-prev]')?.addEventListener('click', () => { S.step = 1; render(); });
  el.querySelector('[data-x]')?.addEventListener('click', () => toast('Fecha o modal e volta para a lista'));
  el.querySelector('[data-ok]')?.addEventListener('click', () => toast(`OS ${v.os} faturada (wireframe: nada é gravado)`));
  el.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => toast(`Copiado: ${b.dataset.copy}`)));
  el.querySelectorAll('[data-todo]').forEach((b) => (b.onclick = () => toast('Copia todos os dados do lançamento')));
}

let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function render() {
  seg('wf-step', [[1, '1. Conferir'], [2, '2. Registrar']], 'step');
  seg('wf-os', [['conclusao', 'Liberada na conclusão'], ['venda', 'Liberada na venda']], 'venda');
  seg('wf-theme', [['light', 'Claro'], ['dark', 'Escuro']], 'theme');
  fundo(); renderModal();
  window.lucide && lucide.createIcons();
}
render();
</script>
</body>
</html>
