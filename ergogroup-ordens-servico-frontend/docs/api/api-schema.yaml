      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
