components:
  schemas:
    AcaoEnum:
      enum:
      - criacao
      - atualizacao
      - exclusao
      - status
      - propagacao_status
      - liberacao_faturamento
      - faturamento
      - liberacao_cobranca
      - cobranca_realizada
      - contrato
      - backfill
      type: string
      description: |-
        * `criacao` - Criação
        * `atualizacao` - Atualização
        * `exclusao` - Exclusão
        * `status` - Mudança de Status
        * `propagacao_status` - Propagação de Status
        * `liberacao_faturamento` - Liberação para Faturamento
        * `faturamento` - Faturamento
        * `liberacao_cobranca` - Liberação de Cobrança
        * `cobranca_realizada` - Cobrança Realizada
        * `contrato` - Contrato
        * `backfill` - Backfill
    BlankEnum:
      enum:
      - ''
    BlocoCancelamento:
      type: object
      properties:
        total:
          type: integer
        canceladas:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - canceladas
      - percentual
      - total
    BlocoCumprimentoPrazo:
      type: object
      properties:
        total_com_prazo:
          type: integer
        no_prazo:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - no_prazo
      - percentual
      - total_com_prazo
    CancelamentoPorCatalogo:
      type: object
      properties:
        catalogo_id:
          type: integer
        catalogo_nome:
          type: string
        total:
          type: integer
        canceladas:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - canceladas
      - catalogo_id
      - catalogo_nome
      - percentual
      - total
    Catalogo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subitens:
          type: array
          items:
            $ref: '#/components/schemas/SubitemCatalogo'
          readOnly: true
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
        horas_estimadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        complexidade:
          nullable: true
          minimum: 0
          maximum: 65535
          oneOf:
          - $ref: '#/components/schemas/ComplexidadeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - id
      - nome
      - subitens
    CatalogoOperacional:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 50
        descricao:
          type: string
          nullable: true
        horas_estimadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        complexidade:
          nullable: true
          minimum: 0
          maximum: 65535
          oneOf:
          - $ref: '#/components/schemas/ComplexidadeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - id
      - nome
    CatalogoOperacionalRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 50
        descricao:
          type: string
          nullable: true
        horas_estimadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        complexidade:
          nullable: true
          minimum: 0
          maximum: 65535
          oneOf:
          - $ref: '#/components/schemas/ComplexidadeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - nome
    CatalogoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        descricao:
          type: string
          nullable: true
        horas_estimadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        complexidade:
          nullable: true
          minimum: 0
          maximum: 65535
          oneOf:
          - $ref: '#/components/schemas/ComplexidadeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - nome
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo_cliente_display:
          type: string
          readOnly: true
        tipo_inscricao_display:
          type: string
          readOnly: true
        nome:
          type: string
          maxLength: 100
        tipo_inscricao:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TipoInscricaoEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        numero_inscricao:
          type: string
          nullable: true
          maxLength: 30
        tipo_cliente:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TipoClienteEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        observacao:
          type: string
          nullable: true
        nome_representante:
          type: string
          nullable: true
          maxLength: 50
        setor_representante:
          type: string
          nullable: true
          maxLength: 50
        email_representante:
          type: string
          format: email
          nullable: true
          maxLength: 254
        contato_representante:
          type: string
          nullable: true
          maxLength: 50
        cobranca_revisao_alteracao:
          type: boolean
        ativo:
          type: boolean
        data_criacao:
          type: string
          format: date-time
          readOnly: true
      required:
      - data_criacao
      - id
      - nome
      - tipo_cliente_display
      - tipo_inscricao_display
    ClienteCobranca:
      type: object
      properties:
        cliente_id:
          type: integer
        cliente_nome:
          type: string
        total_valor_cobrado:
