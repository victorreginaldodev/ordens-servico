    PermissoesEnum:
      enum:
      - os.ver_todas
      - os.gerenciar
      - os.excluir
      - os_operacional.gerenciar
      - financeiro.ver_valores
      - financeiro.registrar_cobranca
      - clientes.gerenciar
      - catalogo.gerenciar
      - servicos.ver_setor
      - servicos.gerenciar
      - tarefas.distribuir
      - tarefas.editar_setor
