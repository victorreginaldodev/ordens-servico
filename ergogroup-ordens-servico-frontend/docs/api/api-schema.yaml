  /api/execucao/servicos/{id}/distribuir/:
    post:
      operationId: execucao_servicos_distribuir_create
      description: 'Cria as tarefas do serviço em um passo: responsável e prazo. Uma
        tarefa distribui para uma pessoa; várias dividem o serviço. Também acrescenta
        tarefas a um serviço já distribuído. Exige `tarefas.distribuir` no setor do
        serviço, e cada responsável precisa pertencer ao setor.'
      summary: Distribuir o serviço
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - execução
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistribuirRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DistribuirRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DistribuirRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheDoServico'
          description: ''
  /api/execucao/servicos/recebimento/:
    post:
      operationId: execucao_servicos_recebimento_create
      description: 'Ciência do setor de que os serviços chegaram (ADR 0009): passam
        de novo para a distribuir. Aceita vários de uma vez. Exige `tarefas.distribuir`
        no setor de cada serviço; se faltar em algum, nada é gravado. Serviço que
        já tinha ciência volta em `ja_recebidos`. Distribuir também registra a ciência.'
      summary: Confirmar recebimento de serviços
      tags:
      - execução
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceberServicosRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceberServicosRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceberServicosRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicosRecebidos'
          description: ''
  /api/execucao/setores/:
    get:
      operationId: execucao_setores_list
      description: Setores em que a pessoa tem `servicos.ver_setor` (com `setores.todos`,
        todos os setores de execução), com os contadores do painel. `organiza` indica
        se ela pode distribuir no setor.
      summary: Setores que acompanho
