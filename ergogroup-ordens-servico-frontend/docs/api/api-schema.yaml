components:
  schemas:
    AcaoEnum:
      enum:
      - criacao
      - atualizacao
      - exclusao
      - status
      - propagacao_status
      - liberacao_faturamento
      - faturamento
      - liberacao_cobranca
      - cobranca_realizada
      - contrato
      - ciencia_alerta
      - backfill
      type: string
      description: |-
        * `criacao` - Criação
        * `atualizacao` - Atualização
        * `exclusao` - Exclusão
        * `status` - Mudança de Status
        * `propagacao_status` - Propagação de Status
        * `liberacao_faturamento` - Liberação para Faturamento
        * `faturamento` - Faturamento
        * `liberacao_cobranca` - Liberação de Cobrança
        * `cobranca_realizada` - Cobrança Realizada
        * `contrato` - Contrato
        * `ciencia_alerta` - Ciência de alerta
        * `backfill` - Backfill
    Alerta:
      type: object
      properties:
        ordem_servico_id:
          type: integer
        cliente_id:
          type: integer
        cliente_nome:
          type: string
        data_venda:
          type: string
          format: date
        vendido_por_nome:
          type: string
          nullable: true
        ciencia_vigente:
          type: boolean
        alerta_ciente_em:
          type: string
          format: date-time
          nullable: true
        alerta_ciente_por_nome:
          type: string
          nullable: true
        alerta_ciente_motivo:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MotivoCienciaEnum'
          - $ref: '#/components/schemas/NullEnum'
        alerta_ciente_observacao:
          type: string
          nullable: true
        servico_id:
          type: integer
        catalogo_nome:
          type: string
          nullable: true
        descricao:
          type: string
        etapa:
          $ref: '#/components/schemas/EtapaEnum'
        prazo:
          type: string
          format: date
          nullable: true
        motivos:
          type: array
          items:
            $ref: '#/components/schemas/MotivosEnum'
        dias_sem_movimentacao:
          type: integer
        responsaveis:
          type: array
          items:
            type: string
      required:
      - alerta_ciente_em
      - alerta_ciente_motivo
      - alerta_ciente_observacao
      - alerta_ciente_por_nome
      - catalogo_nome
      - ciencia_vigente
      - cliente_id
      - cliente_nome
      - data_venda
      - descricao
      - dias_sem_movimentacao
      - etapa
      - motivos
      - ordem_servico_id
      - prazo
      - responsaveis
      - servico_id
      - vendido_por_nome
