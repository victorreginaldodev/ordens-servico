      parameters:
      - in: query
        name: ate
        schema:
          type: string
        description: 'Data final (AAAA-MM-DD). Padrão: hoje.'
      - in: query
        name: de
        schema:
          type: string
        description: 'Data inicial (AAAA-MM-DD). Padrão: primeiro dia do mês atual.'
      - in: query
        name: etapa
        schema:
          type: string
          enum:
          - a_iniciar
          - em_andamento
          - nova
        description: Etapa da tarefa (sem `status`).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - concluida
        description: Histórico de concluídas.
      tags:
      - execução
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinhaDeTarefa'
          description: ''
  /api/execucao/meus-servicos/contadores/:
    get:
      operationId: execucao_meus_servicos_contadores_retrieve
      description: 'Quantas tarefas ativas da pessoa estão em cada etapa: nova, a
        iniciar e em andamento.'
      summary: Contadores de Meus serviços
      tags:
      - execução
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
