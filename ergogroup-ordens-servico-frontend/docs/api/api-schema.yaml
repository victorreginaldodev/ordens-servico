components:
  schemas:
    AcaoEnum:
      enum:
      - criacao
      - atualizacao
      - exclusao
      - status
      - propagacao_status
      - liberacao_faturamento
      - faturamento
      - liberacao_cobranca
      - cobranca_realizada
      - contrato
      - ciencia_alerta
      - recebimento
      - backfill
      type: string
      description: |-
        * `criacao` - Criação
        * `atualizacao` - Atualização
        * `exclusao` - Exclusão
        * `status` - Mudança de Status
        * `propagacao_status` - Propagação de Status
        * `liberacao_faturamento` - Liberação para Faturamento
        * `faturamento` - Faturamento
        * `liberacao_cobranca` - Liberação de Cobrança
        * `cobranca_realizada` - Cobrança Realizada
        * `contrato` - Contrato
        * `ciencia_alerta` - Ciência de alerta
        * `recebimento` - Ciência de recebimento
        * `backfill` - Backfill
    Alerta:
      type: object
      properties:
        ordem_servico_id:
          type: integer
        cliente_id:
          type: integer
        cliente_nome:
          type: string
        data_venda:
          type: string
          format: date
        vendido_por_nome:
          type: string
          nullable: true
        ciencia_vigente:
          type: boolean
        alerta_ciente_em:
          type: string
          format: date-time
          nullable: true
        alerta_ciente_por_nome:
          type: string
          nullable: true
        alerta_ciente_motivo:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MotivoCienciaEnum'
          - $ref: '#/components/schemas/NullEnum'
        alerta_ciente_observacao:
          type: string
          nullable: true
        ciencia_ate:
          type: string
          format: date
          nullable: true
          description: Até quando a pausa explicada silencia o aviso.
        servico_id:
          type: integer
        catalogo_nome:
          type: string
          nullable: true
        descricao:
          type: string
        etapa:
          $ref: '#/components/schemas/EtapaEnum'
        prazo:
          type: string
          format: date
          nullable: true
        motivos:
          type: array
          items:
            $ref: '#/components/schemas/MotivosEnum'
        dias_sem_movimentacao:
          type: integer
        responsaveis:
          type: array
          items:
            type: string
      required:
      - alerta_ciente_em
      - alerta_ciente_motivo
      - alerta_ciente_observacao
      - alerta_ciente_por_nome
      - catalogo_nome
      - ciencia_ate
      - ciencia_vigente
      - cliente_id
      - cliente_nome
      - data_venda
      - descricao
      - dias_sem_movimentacao
      - etapa
      - motivos
      - ordem_servico_id
      - prazo
      - responsaveis
      - servico_id
      - vendido_por_nome
    Andamento:
      type: object
      properties:
        total:
          type: integer
        novo:
          type: integer
        a_distribuir:
          type: integer
        distribuido:
          type: integer
        em_execucao:
          type: integer
        concluido:
          type: integer
        cancelado:
          type: integer
      required:
      - a_distribuir
      - cancelado
      - concluido
      - distribuido
      - em_execucao
      - novo
      - total
    Atuacao:
      type: object
      description: 'Setor em que a pessoa "também executa": recebe tarefas lá, sem
        permissões de gestão.'
      properties:
        setor:
          type: integer
        setor_nome:
          type: string
      required:
      - setor
      - setor_nome
    BlankEnum:
      enum:
      - ''
    BlocoCancelamento:
      type: object
      properties:
        total:
          type: integer
        canceladas:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - canceladas
      - percentual
      - total
    BlocoCumprimentoPrazo:
      type: object
      properties:
        total_com_prazo:
          type: integer
        no_prazo:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - no_prazo
      - percentual
      - total_com_prazo
    CancelamentoPorCatalogo:
      type: object
      properties:
        catalogo_id:
          type: integer
        catalogo_nome:
          type: string
        total:
          type: integer
        canceladas:
          type: integer
        percentual:
          type: number
          format: double
          nullable: true
      required:
      - canceladas
      - catalogo_id
      - catalogo_nome
      - percentual
      - total
    Catalogo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
        setor:
          type: integer
          title: Setor responsável pela execução
          description: Setor responsável por executar este serviço.
        setor_nome:
          type: string
          readOnly: true
        ativo:
          type: boolean
          default: true
          description: Catálogos inativos continuam nos serviços já vendidos, mas
            não podem ser usados em serviços novos.
        subitens:
          type: array
          items:
            $ref: '#/components/schemas/SubitemCatalogo'
          readOnly: true
        servicos_em_aberto:
          type: integer
          readOnly: true
          description: Serviços deste catálogo abertos e ainda sem tarefas (novos
            ou a distribuir), em qualquer setor.
        servicos_com_tarefas:
          type: integer
          readOnly: true
          description: Serviços deste catálogo já distribuídos ou em andamento, em
            qualquer setor.
        servicos_em_aberto_fora_do_setor:
          type: integer
          readOnly: true
          description: Dos `servicos_em_aberto`, os que estão em outro setor que não
            o do catálogo.
        servicos_com_tarefas_fora_do_setor:
          type: integer
          readOnly: true
          description: Dos `servicos_com_tarefas`, os que estão em outro setor que
            não o do catálogo.
      required:
      - id
      - nome
      - servicos_com_tarefas
      - servicos_com_tarefas_fora_do_setor
      - servicos_em_aberto
      - servicos_em_aberto_fora_do_setor
      - setor
      - setor_nome
      - subitens
    CatalogoOperacional:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 50
        descricao:
          type: string
          nullable: true
        horas_estimadas:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        complexidade:
          nullable: true
          minimum: 0
          maximum: 65535
          oneOf:
