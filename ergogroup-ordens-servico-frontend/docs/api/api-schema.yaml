          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRegistrarCobrancaOSORequestRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoOperacional'
          description: ''
        '400':
          description: No response body
  /api/ordens-servico/ordens/:
    get:
      operationId: ordens_servico_ordens_list
      description: Retorna a lista paginada de ordens de serviço com campos resumidos,
        ordenadas por status de cobrança e data da venda. Suporta busca textual e
        filtragem por cliente, conclusão, cobrança e liberação.
      summary: Listar ordens de serviço
      parameters:
      - in: query
        name: cliente
        schema:
          type: integer
        description: Filtrar pelo ID do cliente.
      - in: query
        name: cobranca_realizada
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por status de cobrança.
      - in: query
        name: concluida
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por conclusão.
      - in: query
        name: etapa
        schema:
          type: string
          enum:
          - a_distribuir
          - cancelado
          - concluido
          - distribuido
          - em_execucao
          - novo
