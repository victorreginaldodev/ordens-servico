          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceberTarefasRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TarefasRecebidas'
          description: ''
  /api/financeiro/cobrancas/:
    get:
      operationId: financeiro_cobrancas_retrieve
      description: 'As OS de uma situação, com tudo o que o financeiro precisa para
        faturar: `a_faturar` (liberadas e ainda não lançadas, as mais antigas primeiro),
        `faturadas` (lançadas, as mais recentes primeiro) e `previsao` (ainda não
        liberadas, as mais perto de liberar primeiro; sem as canceladas). Com `todas`,
        as três numa chamada (a faturar, previsão e faturadas, nessa ordem). Traz
        os contadores das três situações sob os mesmos filtros, o que falta em cada
        OS da previsão (`pendentes`) e os códigos da conferência (`pendencias`). Exige
        `financeiro.registrar_cobranca` e `financeiro.ver_valores`.'
      summary: Cobranças
      parameters:
      - in: query
        name: ate
        schema:
          type: string
        description: Vendas até esta data (AAAA-MM-DD).
      - in: query
        name: cliente
        schema:
          type: integer
        description: Filtrar pelo cliente.
      - in: query
        name: de
        schema:
          type: string
        description: Vendas a partir desta data (AAAA-MM-DD).
      - in: query
        name: em_alerta
        schema:
          type: string
          enum:
          - 'true'
        description: Só as liberadas há N dias sem lançamento.
      - in: query
        name: faturada_ate
        schema:
          type: string
        description: Faturadas lançadas até esta data (AAAA-MM-DD).
      - in: query
        name: faturada_de
        schema:
          type: string
        description: Faturadas lançadas a partir desta data (AAAA-MM-DD).
      - in: query
        name: forma_pagamento
        schema:
          type: string
          enum:
          - boleto
          - cheque
          - credito
          - debito
          - dinheiro
          - outro
          - pix
          - transferencia
      - in: query
        name: situacao
        schema:
          type: string
          enum:
          - a_faturar
          - faturadas
          - previsao
          - todas
        description: 'Padrão: `a_faturar`.'
      - in: query
        name: tipo_condicao
        schema:
          type: string
          enum:
          - a_vista
          - parcelado
      tags:
      - financeiro
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cobrancas'
          description: ''
  /api/financeiro/conferencia/:
    get:
      operationId: financeiro_conferencia_retrieve
      description: O que o sistema verifica para que nada concluído fique sem cobrança
        (faturamento/04). As garantias (`tipo=garantia`) são as regras da liberação
        e devem dar sempre 0; as atenções dizem o que depende de alguém ou o que mudou
        depois da liberação ou do lançamento, com o serviço, o setor e quem está com
        ele. Calculada na hora da consulta. Exige `financeiro.registrar_cobranca`
        e `financeiro.ver_valores`.
      summary: Conferência do faturamento
      tags:
      - financeiro
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conferencia'
          description: ''
  /api/financeiro/conferencia/corrigir/:
    post:
      operationId: financeiro_conferencia_corrigir_create
      description: Refaz a sincronização dos serviços e das OS ainda não liberadas
        (o mesmo que acontece quando uma tarefa é salva). Só aplica o que a regra
        manda; cada mudança fica na auditoria. Devolve quantos serviços mudaram de
        status e quantas OS foram liberadas.
      summary: Corrigir a sincronização
      tags:
      - financeiro
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correcao'
          description: ''
  /api/financeiro/ordens/{id}/:
    get:
      operationId: financeiro_ordens_retrieve
      description: 'O resumo para faturar: os dados do cliente; condição, liberação,
        lançamento e alerta da OS; os serviços realizados (setor, quem executou, início,
        término e quem finalizou); as pendências da conferência; e a linha do tempo
        da OS, com a categoria de cada evento (`financeiro` ou `execucao`). Exige
        `financeiro.ver_valores`.'
      summary: Situação financeira da OS
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - financeiro
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SituacaoFinanceira'
          description: ''
  /api/ordens-servico/operacionais/:
    get:
      operationId: ordens_servico_operacionais_list
      description: Retorna a lista paginada de Ordens de Serviço Operacionais. Técnicos
        veem apenas as próprias; demais perfis veem todas.
      summary: Listar Ordens de Serviço Operacionais
      parameters:
      - in: query
        name: atrasada
        schema:
          type: string
          enum:
          - 'true'
        description: Se "true", retorna apenas OSOs com prazo vencido e não finalizadas.
      - in: query
        name: cliente
        schema:
          type: integer
        description: Filtrar pelo ID do cliente.
      - in: query
        name: cobranca_realizada
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por status de cobrança.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -prazo
          - prazo
        description: Ordenar por prazo. Use "prazo" ou "-prazo".
      - in: query
        name: prioridade
        schema:
          type: string
          enum:
          - alta
          - baixa
          - media
        description: Filtrar por prioridade.
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome do cliente ou catálogo operacional (parcial).
      - in: query
        name: responsavel
        schema:
          type: integer
        description: Filtrar pelo ID do responsável.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - em_andamento
          - finalizada
          - nao_iniciado
        description: Filtrar por status.
      tags:
      - ordens-servico
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdemServicoOperacionalList'
          description: ''
    post:
      operationId: ordens_servico_operacionais_create
      description: Cria uma nova Ordem de Serviço Operacional. Se `revisao_cliente=true`,
        `gera_cobranca` é definido automaticamente como `true` e, ao finalizar, `data_liberacao_cobranca`
        e `liberada_cobranca_por` são preenchidos automaticamente.
      summary: Criar Ordem de Serviço Operacional
      tags:
      - ordens-servico
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrdemServicoOperacionalRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoOperacional'
          description: ''
  /api/ordens-servico/operacionais/{id}/:
