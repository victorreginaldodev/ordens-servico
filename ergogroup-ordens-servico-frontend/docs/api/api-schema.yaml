                $ref: '#/components/schemas/ContadoresMeusServicos'
          description: ''
  /api/execucao/servicos/{id}/:
    get:
      operationId: execucao_servicos_retrieve
      description: O serviço com tarefas, prazo, alerta e ciência, o contexto da venda
        (sem valores) e os outros serviços da mesma OS. `pode_distribuir`, `pode_dar_ciencia`
        e `pode_confirmar_recebimento` (no serviço e em cada tarefa) dizem quais ações
        mostrar.
      summary: Detalhe do serviço
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - execução
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheDoServico'
          description: ''
  /api/execucao/servicos/{id}/ciencia/:
    post:
      operationId: execucao_servicos_ciencia_create
      description: 'O serviço está sem andamento porque espera algo: o motivo (obrigatório;
        "outro" exige a observação) silencia o aviso por N dias e fica visível para
        o setor (`ciencia_ate`). Se o trabalho andou, o certo é atualizar a tarefa.
        Pode explicar quem tem tarefa no serviço ou quem acompanha o setor.'
      summary: Explicar a pausa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - execução
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CienciaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CienciaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CienciaRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheDoServico'
