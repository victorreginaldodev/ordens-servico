openapi: 3.0.3
info:
  title: ErgoApp API
  version: 1.0.0
  description: Documentação completa das APIs do sistema ErgoApp
paths:
  /api/analise/financeiro/:
    get:
      operationId: analise_financeiro_retrieve
      description: KPIs de cobrança, ticket médio, vendas mensais e ranking de clientes;
        a faturar, faturado e previsão por tipo de condição e a receita recorrente
        mensal. Exige a permissão `financeiro.ver_valores` (403 sem ela).
      summary: Análise financeira
      tags:
      - analise
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceiroAnaliseResponse'
          description: ''
        '403':
          description: Sem permissão para ver valores financeiros.
  /api/analise/operacional/:
    get:
      operationId: analise_operacional_retrieve
      description: Métricas agregadas de ordens de serviço, serviços, tarefas, OS
        operacionais, tempos médios, cancelamento, cumprimento de prazo e produtividade
        por técnico. Não contém valores monetários nem dados de clientes ranqueados
        por valor — disponível para qualquer perfil autenticado. Técnicos veem apenas
        a própria linha em `por_tecnico`.
      summary: Análise operacional
      tags:
      - analise
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionalAnaliseResponse'
          description: ''
  /api/auditoria/registros/:
    get:
      operationId: auditoria_registros_list
      description: Retorna a lista paginada de todos os registros de auditoria. Suporta
        filtragem por entidade, objeto, ação e vínculo com ordens de serviço, serviços,
        tarefas e mini OS.
      summary: Listar registros de auditoria
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - atualizacao
          - backfill
          - ciencia_alerta
          - cobranca_realizada
          - contrato
          - criacao
          - exclusao
          - faturamento
          - liberacao_cobranca
          - liberacao_faturamento
          - propagacao_status
          - status
        description: Filtrar pelo tipo de ação registrada.
      - in: query
        name: entidade
        schema:
          type: string
          enum:
          - mini_os
          - ordem_servico
          - servico
          - tarefa
        description: Filtrar por entidade auditada.
      - in: query
        name: mini_os
        schema:
          type: integer
        description: Filtrar pelo ID da mini OS.
      - in: query
        name: objeto_id
        schema:
          type: integer
        description: Filtrar pelo ID do objeto auditado.
      - in: query
        name: ordem_servico
        schema:
          type: integer
        description: Filtrar pelo ID da ordem de serviço.
      - in: query
        name: servico
        schema:
          type: integer
        description: Filtrar pelo ID do serviço.
      - in: query
        name: tarefa
        schema:
          type: integer
        description: Filtrar pelo ID da tarefa.
      tags:
      - auditoria
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
  /api/auditoria/registros/{id}/:
    get:
      operationId: auditoria_registros_retrieve
      description: Retorna um único registro de auditoria pelo seu ID.
      summary: Detalhar registro de auditoria
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Registro de Auditoria.
        required: true
      tags:
      - auditoria
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
  /api/auditoria/registros/mini-os/{mini_os_id}/timeline/:
    get:
      operationId: auditoria_registros_mini_os_timeline_list
      description: Retorna todos os registros de auditoria vinculados a uma mini OS,
        em ordem cronológica decrescente.
      summary: Timeline de uma mini OS
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - atualizacao
          - backfill
          - ciencia_alerta
          - cobranca_realizada
          - contrato
          - criacao
          - exclusao
          - faturamento
          - liberacao_cobranca
          - liberacao_faturamento
          - propagacao_status
          - status
        description: Filtrar pelo tipo de ação registrada.
      - in: query
        name: entidade
        schema:
          type: string
          enum:
          - mini_os
          - ordem_servico
          - servico
          - tarefa
        description: Filtrar por entidade auditada.
      - in: query
        name: mini_os
        schema:
          type: integer
        description: Filtrar pelo ID da mini OS.
      - in: path
        name: mini_os_id
        schema:
          type: integer
        description: ID da mini OS.
        required: true
      - in: query
        name: objeto_id
        schema:
          type: integer
        description: Filtrar pelo ID do objeto auditado.
      - in: query
        name: ordem_servico
        schema:
          type: integer
        description: Filtrar pelo ID da ordem de serviço.
      - in: query
        name: servico
        schema:
          type: integer
        description: Filtrar pelo ID do serviço.
      - in: query
        name: tarefa
        schema:
          type: integer
        description: Filtrar pelo ID da tarefa.
      tags:
      - auditoria
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
  /api/auditoria/registros/ordens/{ordem_servico_id}/timeline/:
    get:
      operationId: auditoria_registros_ordens_timeline_list
      description: Retorna todos os registros de auditoria vinculados a uma ordem
        de serviço, em ordem cronológica decrescente.
      summary: Timeline de uma ordem de serviço
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - atualizacao
          - backfill
          - ciencia_alerta
          - cobranca_realizada
          - contrato
          - criacao
          - exclusao
          - faturamento
          - liberacao_cobranca
          - liberacao_faturamento
          - propagacao_status
          - status
        description: Filtrar pelo tipo de ação registrada.
      - in: query
        name: entidade
        schema:
          type: string
          enum:
          - mini_os
          - ordem_servico
          - servico
          - tarefa
        description: Filtrar por entidade auditada.
      - in: query
        name: mini_os
        schema:
          type: integer
        description: Filtrar pelo ID da mini OS.
      - in: query
        name: objeto_id
        schema:
          type: integer
        description: Filtrar pelo ID do objeto auditado.
      - in: query
        name: ordem_servico
        schema:
          type: integer
        description: Filtrar pelo ID da ordem de serviço.
      - in: path
        name: ordem_servico_id
        schema:
          type: integer
        description: ID da ordem de serviço.
        required: true
      - in: query
        name: servico
        schema:
          type: integer
        description: Filtrar pelo ID do serviço.
      - in: query
        name: tarefa
        schema:
          type: integer
        description: Filtrar pelo ID da tarefa.
      tags:
      - auditoria
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
  /api/catalogo/catalogos/:
    get:
      operationId: catalogo_catalogos_list
      description: Retorna a lista de catálogos com seus subitens. O `setor` de cada
        catálogo é o setor responsável por executar o serviço. Suporta busca por nome
        ou descrição e filtros por setor e status.
      summary: Listar catálogos
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por status. Para a criação de OS, use `ativo=true`.
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome ou descrição (parcial).
      - in: query
        name: setor
        schema:
          type: integer
        description: Filtrar pelo setor responsável pela execução.
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Catalogo'
          description: ''
    post:
      operationId: catalogo_catalogos_create
      description: Cria um novo catálogo. O setor responsável pela execução é obrigatório
        e precisa estar ativo. A resposta traz `avisos` quando o setor ainda não tem
        quem o organize.
      summary: Criar catálogo
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogo'
          description: ''
  /api/catalogo/catalogos-operacionais/:
    get:
      operationId: catalogo_catalogos_operacionais_list
      description: Retorna o catálogo de serviços disponíveis para Ordens de Serviço
        Operacionais. Suporta busca por nome ou descrição.
      summary: Listar catálogos operacionais
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome ou descrição (parcial).
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoOperacional'
          description: ''
    post:
      operationId: catalogo_catalogos_operacionais_create
      description: Cria um novo serviço no catálogo operacional.
      summary: Criar catálogo operacional
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoOperacional'
          description: ''
  /api/catalogo/catalogos-operacionais/{id}/:
    get:
      operationId: catalogo_catalogos_operacionais_retrieve
      description: Retorna todos os campos de um catálogo operacional pelo seu ID.
      summary: Detalhar catálogo operacional
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo Operacional.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoOperacional'
          description: ''
    put:
      operationId: catalogo_catalogos_operacionais_update
      description: Substitui integralmente os dados de um catálogo operacional.
      summary: Atualizar catálogo operacional
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo Operacional.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogoOperacionalRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoOperacional'
          description: ''
    patch:
      operationId: catalogo_catalogos_operacionais_partial_update
      description: Atualiza um ou mais campos de um catálogo operacional.
      summary: Atualizar catálogo operacional parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo Operacional.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoOperacionalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoOperacionalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoOperacionalRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoOperacional'
          description: ''
    delete:
      operationId: catalogo_catalogos_operacionais_destroy
      description: Remove permanentemente um catálogo operacional.
      summary: Remover catálogo operacional
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo Operacional.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/catalogo/catalogos/{id}/:
    get:
      operationId: catalogo_catalogos_retrieve
      description: Retorna todos os campos de um catálogo, incluindo seus subitens.
      summary: Detalhar catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogo'
          description: ''
    put:
      operationId: catalogo_catalogos_update
      description: Substitui integralmente os dados de um catálogo.
      summary: Atualizar catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogoRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogo'
          description: ''
    patch:
      operationId: catalogo_catalogos_partial_update
      description: Atualiza um ou mais campos de um catálogo.
      summary: Atualizar catálogo parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCatalogoRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogo'
          description: ''
    delete:
      operationId: catalogo_catalogos_destroy
      description: Remove permanentemente um catálogo e todos os seus subitens. Retorna
        409 se o catálogo estiver vinculado a serviços; nesse caso, desative-o (`ativo=false`).
      summary: Remover catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Catálogo.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/catalogo/subitens/:
    get:
      operationId: catalogo_subitens_list
      description: Retorna a lista de subitens de catálogo. Suporta filtragem por
        catálogo, status e busca textual.
      summary: Listar subitens de catálogo
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por status de ativação.
      - in: query
        name: catalogo
        schema:
          type: integer
        description: Filtrar pelo ID do catálogo.
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome ou descrição (parcial).
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubitemCatalogo'
          description: ''
    post:
      operationId: catalogo_subitens_create
      description: Cria um novo subitem vinculado a um catálogo. O par (catálogo,
        nome) deve ser único.
      summary: Criar subitem de catálogo
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubitemCatalogo'
          description: ''
  /api/catalogo/subitens/{id}/:
    get:
      operationId: catalogo_subitens_retrieve
      description: Retorna todos os campos de um subitem de catálogo pelo seu ID.
      summary: Detalhar subitem de catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Subitem de catálogo.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubitemCatalogo'
          description: ''
    put:
      operationId: catalogo_subitens_update
      description: Substitui integralmente os dados de um subitem de catálogo.
      summary: Atualizar subitem de catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Subitem de catálogo.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubitemCatalogoRequest'
        required: true
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubitemCatalogo'
          description: ''
    patch:
      operationId: catalogo_subitens_partial_update
      description: Atualiza um ou mais campos de um subitem de catálogo.
      summary: Atualizar subitem de catálogo parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Subitem de catálogo.
        required: true
      tags:
      - catalogo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubitemCatalogoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubitemCatalogoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubitemCatalogoRequest'
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubitemCatalogo'
          description: ''
    delete:
      operationId: catalogo_subitens_destroy
      description: Remove permanentemente um subitem de catálogo.
      summary: Remover subitem de catálogo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Subitem de catálogo.
        required: true
      tags:
      - catalogo
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clientes/clientes/:
    get:
      operationId: clientes_clientes_list
      description: Retorna a lista paginada de clientes com campos resumidos. Suporta
        busca textual e filtragem por tipo e status.
      summary: Listar clientes
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filtrar por status de ativação.
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome ou número de inscrição (parcial, sem distinção
          de maiúsculas).
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - avulso
          - fornecedor
          - gestao
        description: Filtrar por tipo de cliente.
      tags:
      - clientes
      security:
      - jwtAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteList'
          description: ''
    post:
      operationId: clientes_clientes_create
      description: Cria um novo cliente com todos os dados cadastrais.
      summary: Cadastrar cliente
      tags:
      - clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          multipart/form-data:
            schema:
