    UsuarioCreate:
      type: object
      description: Grava os vínculos enviados em `vinculos` com as proteções de `definir_vinculos`.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        nome_completo:
          type: string
          maxLength: 255
        ativo:
          type: boolean
          default: true
        vinculos:
          type: array
          items:
            $ref: '#/components/schemas/Vinculo'
          description: 'Setor e função do usuário: lista com no máximo um item.'
        tambem_executa_em:
          type: array
          items:
            type: integer
          description: IDs dos setores, fora o da lotação, em que a pessoa também
            recebe tarefas. Se enviado, substitui a lista. Cada setor que entra ou
            sai exige `tarefas.distribuir` nele.
      required:
      - email
      - id
      - nome_completo
      - username
    UsuarioCreateRequest:
      type: object
      description: Grava os vínculos enviados em `vinculos` com as proteções de `definir_vinculos`.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 1
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        nome_completo:
          type: string
          minLength: 1
          maxLength: 255
        ativo:
          type: boolean
          default: true
        vinculos:
          type: array
          items:
            $ref: '#/components/schemas/VinculoRequest'
          description: 'Setor e função do usuário: lista com no máximo um item.'
        tambem_executa_em:
          type: array
          items:
            type: integer
          description: IDs dos setores, fora o da lotação, em que a pessoa também
            recebe tarefas. Se enviado, substitui a lista. Cada setor que entra ou
            sai exige `tarefas.distribuir` nele.
        password:
          type: string
          writeOnly: true
          minLength: 1
        password_confirmacao:
