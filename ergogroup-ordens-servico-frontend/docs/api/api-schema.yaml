  /api/execucao/tarefas/recebimento/:
    post:
      operationId: execucao_tarefas_recebimento_create
      description: 'Ciência do responsável de que a tarefa é dele (ADR 0009): passa
        de nova para a iniciar. Aceita várias de uma vez. Só o responsável confirma;
        se alguma não for dele, nada é gravado. Começar a tarefa também registra a
        ciência; trocar o responsável a zera.'
      summary: Confirmar recebimento de tarefas
      tags:
